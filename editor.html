  container.appendChild(wrap);
  hist.push({action:'insert', el:wrap});
  document.getElementById('badge').classList.add('on');

  // Focus immediately with the placeholder text selected, so typing replaces it right away
  requestAnimationFrame(() => {
    p.focus();
    const range = document.createRange();
    range.selectNodeContents(p);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  });

  toast('Text box added — start typing, drag ✥ to reposition');
}

/* ═══════════════════════════════════════════════
   ADD TEAM MEMBER — inserts a brand-new card into "The Team"
   grid (Home or People page only — the two share data/team.js).
   Trying to "convert" an existing open-position card into a real
   member by editing its text isn't reliable (selecting across its
   nested <a> "Apply now" link and retyping can silently lose the
   text — a Chrome contenteditable quirk, same class of bug as the
   header text box), so this creates a proper new card instead,
   reusing the exact same editing (avatar upload, text editing)
   every other card already has, plus its own delete button since
   this one — unlike the curated existing entries — is meant to be
   easy to undo if added by mistake.
═══════════════════════════════════════════════ */
function triggerAddTeamMember() {
  if (cur !== 'home' && cur !== 'people') {
    toast('Switch to the Home or People page to add a team member', 'err');
    return;
  }
  const prefix = cur === 'home' ? 'person' : 'member';
  const gridId = cur === 'home' ? 'teamGridHome' : 'teamGridPeople';
  const grid = document.getElementById(gridId);
  if (!grid) return;

  const card = document.createElement('div');
  card.className = `${prefix}-card`;
  card.setAttribute('data-cms-card', '1');
  card.style.position = 'relative';
  card.innerHTML = `
    <div class="${prefix}-avatar" style="background:linear-gradient(135deg,#5bb8e8,#1a3a5c);">NN</div>
    <p class="${prefix}-name">New Member</p>
    <p class="${prefix}-role">Role / Title</p>
  `;

  // Always append at the end — inserting before an existing card would shift
  // every later entry's array position, and the save-time sync (which maps
  // DOM position straight to data/team.js index) would silently overwrite
  // the wrong entries. Appending keeps every existing entry's position fixed
  // and lands the new one at the one index guaranteed not to collide: the end.
  grid.appendChild(card);

  attachHandles(card, { gridReorder: grid });
  hist.push({ action: 'insert', el: card });

  // Wire up editability for just the new elements (avatar upload, text
  // editing) by re-running the page's normal init pass — every sub-pass
  // guards on "already wired" attributes, so this only touches what's new.
  initEditing(cur);

  document.getElementById('badge').classList.add('on');
  toast('Team member added — edit the name/role, click 📷 for a photo, then Save');

  requestAnimationFrame(() => {
    const nameEl = card.querySelector(`.${prefix}-name`);
    if (!nameEl) return;
    nameEl.focus();
    const range = document.createRange();
    range.selectNodeContents(nameEl);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);
  });
}

// Global drag-and-drop for images — dropped exactly where the mouse is released
const frameEl = document.getElementById('frame');
frameEl.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect='copy'; });
frameEl.addEventListener('drop', e => {
  e.preventDefault();
  const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
  const dropX = e.clientX, dropY = e.clientY + window.scrollY;
  files.forEach((f, i) => {
    const reader = new FileReader();
    reader.onload = ev => insertImgAt(ev.target.result, f.name, dropX + i*18, dropY + i*18);
    reader.readAsDataURL(f);
  });
});

/* ═══════════════════════════════════════════════
   IMAGE CROP TOOL
   Adds a ✂ crop button to any inserted/dropped image
   (wrap = its .cms-hoverable, img = the live <img>).
   Reused directly for tile photos and, via a small
   temporary <img>, for avatar-sphere headshots too.
═══════════════════════════════════════════════ */
function attachCropButton(wrap, img) {
  const cropBtn = document.createElement('span');
  cropBtn.className = 'cms-crop-btn';
  cropBtn.setAttribute('contenteditable', 'false');
  cropBtn.title = 'Crop this image';
  cropBtn.textContent = '✂';
  wrap.appendChild(cropBtn);
  cropBtn.addEventListener('mousedown', e => e.stopPropagation());
  cropBtn.addEventListener('click', e => {
    e.preventDefault(); e.stopPropagation();
    openCropTool(img, dataUrl => {
      hist.push({ el: img, prevSrc: img.getAttribute('src'), prevOrigName: img.getAttribute('data-orig-name'), action: 'imgSrc' });
      img.src = dataUrl;
      img.setAttribute('data-orig-name', (img.getAttribute('data-orig-name') || img.alt || 'image') + '-cropped.png');
      img.removeAttribute('data-replace-existing');
      // Keep the wrapper/tile's pixel size in sync with the freshly-cropped image
      if (img.style.width) img.style.height = 'auto';
      document.getElementById('badge').classList.add('on');
    });
  });
}

/* ═══════════════════════════════════════════════
   IMAGE RESIZE HANDLE
   A small ⇲ grip in the bottom-right corner of a
   freely-inserted/dropped image. Dragging it only
   ever changes the image's WIDTH — height is always
   left as 'auto', so the browser derives it from the
   image's real aspect ratio automatically, meaning
   the picture can be freely enlarged or shrunk and
   never gets stretched/distorted.
═══════════════════════════════════════════════ */
function attachResizeHandle(wrap, img) {
  const handle = document.createElement('span');
  handle.className = 'cms-resize-handle';
  handle.setAttribute('contenteditable', 'false');
  handle.title = 'Drag to resize (aspect ratio is kept)';
  wrap.appendChild(handle);

  handle.addEventListener('mousedown', e => {
    e.preventDefault(); e.stopPropagation();
    const startX = e.clientX;
    const startWidth = img.getBoundingClientRect().width;
    const prevWidthStyle = img.style.width;
    const prevHeightStyle = img.style.height;
    const minWidth = 40;
    const maxWidth = window.innerWidth * 0.95;

    function mm(ev) {
      const newWidth = Math.min(Math.max(startWidth + (ev.clientX - startX), minWidth), maxWidth);
      img.style.width = newWidth + 'px';
      img.style.height = 'auto';
    }
    function mu() {
      document.removeEventListener('mousemove', mm);
      document.removeEventListener('mouseup', mu);
      if (img.style.width !== prevWidthStyle) {
        hist.push({ action: 'resize', el: img, prevW: prevWidthStyle || startWidth + 'px', prevH: prevHeightStyle || 'auto' });
        document.getElementById('badge').classList.add('on');
      }
    }
    document.addEventListener('mousemove', mm);
    document.addEventListener('mouseup', mu);
  });
}

// srcImg must be a live, already-loaded <img> (naturalWidth/naturalHeight available).
// onApply(dataUrl) is called once the person clicks "Apply crop".
function openCropTool(srcImg, onApply) {
  if (!srcImg || !srcImg.naturalWidth) {
    toast('Image is still loading — try again in a moment', 'err');
    return;
  }

  const overlay = document.createElement('div');
  overlay.id = 'crop-overlay';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:100000;background:rgba(5,13,26,0.9);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;';

  const maxW = Math.min(window.innerWidth * 0.82, 900);
  const maxH = window.innerHeight * 0.62;
  const ratio = Math.min(maxW / srcImg.naturalWidth, maxH / srcImg.naturalHeight, 1);
  const dispW = Math.max(Math.round(srcImg.naturalWidth * ratio), 1);
  const dispH = Math.max(Math.round(srcImg.naturalHeight * ratio), 1);

  const stage = document.createElement('div');
  stage.className = 'crop-stage';
  stage.style.cssText = `width:${dispW}px;height:${dispH}px;`;

  const preview = document.createElement('img');
  preview.src = srcImg.currentSrc || srcImg.src;
  preview.style.cssText = `display:block;width:${dispW}px;height:${dispH}px;user-select:none;pointer-events:none;`;
  stage.appendChild(preview);

  // Crop box — starts covering the full image, in displayed (on-screen) pixels
  const box = { x: 0, y: 0, w: dispW, h: dispH };
  const boxEl = document.createElement('div');
  boxEl.className = 'crop-box';
  function paintBox() {
    boxEl.style.left = box.x + 'px'; boxEl.style.top = box.y + 'px';
    boxEl.style.width = box.w + 'px'; boxEl.style.height = box.h + 'px';
  }
  paintBox();

  const resizeHandle = document.createElement('div');
  resizeHandle.className = 'crop-handle';
  boxEl.appendChild(resizeHandle);
  stage.appendChild(boxEl);

  // Drag the box to move the crop area
  boxEl.addEventListener('mousedown', e => {
    if (e.target === resizeHandle) return;
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY, ox = box.x, oy = box.y;
    function mm(ev) {
      box.x = Math.min(Math.max(ox + ev.clientX - sx, 0), dispW - box.w);
      box.y = Math.min(Math.max(oy + ev.clientY - sy, 0), dispH - box.h);
      paintBox();
    }
    function mu() { document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); }
    document.addEventListener('mousemove', mm);
    document.addEventListener('mouseup', mu);
  });

  // Drag the corner handle to resize the crop area
  resizeHandle.addEventListener('mousedown', e => {
    e.preventDefault(); e.stopPropagation();
    const sx = e.clientX, sy = e.clientY, ow = box.w, oh = box.h;
    function mm(ev) {
      box.w = Math.min(Math.max(ow + ev.clientX - sx, 24), dispW - box.x);
      box.h = Math.min(Math.max(oh + ev.clientY - sy, 24), dispH - box.y);
      paintBox();
    }
    function mu() { document.removeEventListener('mousemove', mm); document.removeEventListener('mouseup', mu); }
    document.addEventListener('mousemove', mm);
    document.addEventListener('mouseup', mu);
  });

  const hint = document.createElement('div');
  hint.className = 'crop-hint';
  hint.textContent = 'Drag the box to move it, drag the ◢ corner to resize it — then Apply crop.';

  const controls = document.createElement('div');
  controls.className = 'crop-controls';
  const cancelBtn = document.createElement('button');
  cancelBtn.className = 'bar-btn';
  cancelBtn.textContent = '✕ Cancel';
  const applyBtn = document.createElement('button');
  applyBtn.className = 'bar-btn';
  applyBtn.style.cssText = 'background:#1a9e6b;border-color:#1a9e6b;color:#fff;font-weight:500;';
  applyBtn.textContent = '✓ Apply crop';
  controls.appendChild(cancelBtn);
  controls.appendChild(applyBtn);

  overlay.appendChild(hint);
  overlay.appendChild(stage);
  overlay.appendChild(controls);
  document.body.appendChild(overlay);

  function close() { overlay.remove(); }
  cancelBtn.addEventListener('click', close);
  overlay.addEventListener('mousedown', e => { if (e.target === overlay) close(); });
  document.addEventListener('keydown', function escClose(e) {
    if (e.key === 'Escape') { close(); document.removeEventListener('keydown', escClose); }
  });

  applyBtn.addEventListener('click', () => {
    const scaleX = srcImg.naturalWidth / dispW;
    const scaleY = srcImg.naturalHeight / dispH;
    const sx = Math.round(box.x * scaleX), sy = Math.round(box.y * scaleY);
    const sw = Math.max(Math.round(box.w * scaleX), 1), sh = Math.max(Math.round(box.h * scaleY), 1);
    const canvas = document.createElement('canvas');
    canvas.width = sw; canvas.height = sh;
    const ctx = canvas.getContext('2d');
    try {
      ctx.drawImage(srcImg, sx, sy, sw, sh, 0, 0, sw, sh);
      const dataUrl = canvas.toDataURL('image/png');
      close();
      onApply(dataUrl);
      toast('✂ Cropped — click 💾 Save page to store it permanently', 'ok');
    } catch (err) {
      toast('Crop failed: ' + err.message, 'err');
    }
  });
}

/* ═══════════════════════════════════════════════
   UNDO
═══════════════════════════════════════════════ */
function undoLast() {
  if (!hist.length) return;
  const h = hist.pop();
  if (h.action === 'delete') {
    if (h.next && h.next.parentNode) h.parent.insertBefore(h.el, h.next);
    else h.parent.appendChild(h.el);
  } else if (h.action === 'insert') {
    if (h.el && h.el.parentNode) h.el.remove();
  } else if (h.action === 'reorder') {
    // restore original order of nav items
    h.parent.innerHTML = '';
    h.prevOrder.forEach(el => h.parent.appendChild(el));
  } else if (h.action === 'avatarPhoto') {
    // revert the sphere back to its initials, keep the camera button intact
    if (h.prevStyle) h.el.setAttribute('style', h.prevStyle);
    else h.el.removeAttribute('style');
    h.el.removeAttribute('data-avatar-orig-name');
    [...h.el.childNodes].forEach(node => { if (node.nodeType === Node.TEXT_NODE) node.remove(); });
    h.el.insertBefore(document.createTextNode(h.prevText || ''), h.el.firstChild);
  } else if (h.action === 'logoImage') {
    // revert the emblem back to its previous state (text or an earlier logo)
    if (h.prevStyle) h.el.setAttribute('style', h.prevStyle);
    else h.el.removeAttribute('style');
    if (h.prevHasLogo) h.el.setAttribute('data-has-logo', h.prevHasLogo);
    else h.el.removeAttribute('data-has-logo');
    h.el.removeAttribute('data-logo-orig-name');
    [...h.el.childNodes].forEach(node => { if (node.nodeType === Node.TEXT_NODE) node.remove(); });
    h.el.insertBefore(document.createTextNode(h.prevText || ''), h.el.firstChild);
  } else if (h.action === 'logoRevert') {
    // restore the logo image that was just reverted away
    if (h.prevStyle) h.el.setAttribute('style', h.prevStyle);
    else h.el.removeAttribute('style');
    if (h.prevHasLogo) h.el.setAttribute('data-has-logo', h.prevHasLogo);
    else h.el.removeAttribute('data-has-logo');
    [...h.el.childNodes].forEach(node => { if (node.nodeType === Node.TEXT_NODE) node.remove(); });
  } else if (h.action === 'tileYoutube') {
    // restore a Gallery tile's previous YouTube link; if this action had
    // created a brand-new <img> where there was none before, put the
    // original placeholder back rather than touching the tile's own
    // buttons (a full innerHTML restore would kill their listeners).
    if (h.prevYoutube) h.el.setAttribute('data-youtube', h.prevYoutube);
    else h.el.removeAttribute('data-youtube');
    if (h.addedImg) {
      const img = h.el.querySelector('img');
      if (img && h.prevPlaceholderHTML) {
        const tmp = document.createElement('div');
        tmp.innerHTML = h.prevPlaceholderHTML;
        img.replaceWith(tmp.firstElementChild);
      }
    }
  } else if (h.action === 'resize') {
    // restore the image/SVG wrapper to its previous pixel dimensions
    h.el.style.width = h.prevW;
    h.el.style.height = h.prevH;
  } else if (h.action === 'move') {
    // restore the element's previous position (images, SVG, avatars, etc.)
    h.el.style.left = h.prevLeft;
    h.el.style.top = h.prevTop;
  } else if (h.action === 'imgSrc') {
    // restore an image's previous source (used by the crop tool)
    h.el.setAttribute('src', h.prevSrc);
    if (h.prevOrigName) h.el.setAttribute('data-orig-name', h.prevOrigName);
    else h.el.removeAttribute('data-orig-name');
  } else if (h.action === 'avatarCrop') {
    // restore an avatar sphere's previous background-image (used by the crop tool)
    if (h.prevStyle) h.el.setAttribute('style', h.prevStyle);
    else h.el.removeAttribute('style');
  } else if (h.action === 'heroCrop') {
    // restore the hero banner's previous background (used by upload/crop/remove)
    if (h.prevStyle) h.el.setAttribute('style', h.prevStyle);
    else h.el.removeAttribute('style');
  } else {
    h.el.innerHTML = h.prev;
    if (h.prevStyle !== undefined) {
      if (h.prevStyle) h.el.setAttribute('style', h.prevStyle);
      else h.el.removeAttribute('style');
    }
  }
  if (!hist.length) document.getElementById('badge').classList.remove('on');
  toast('Undone', 'ok', 1500);
}

/* ═══════════════════════════════════════════════
   HEADER / FOOTER GLOBAL SYNC
   Runs after every successful Save — propagates the
   current page's nav (logo, name, links) and footer
   text to every other page's file on disk, adjusting
   each link's href to be correct for that target page.
═══════════════════════════════════════════════ */
function extractHeaderFooterData(clone) {
  const data = { navItems: [], emblem: '', iceGroup: '', univ: '', footerLeft: '', footerVisitors: '', footerUsyd: '' };

  const ul = clone.querySelector('.nav-links');
  if (ul) {
    [...ul.children].forEach(li => {
      if (li.tagName !== 'LI') return;
      const navId = li.getAttribute('data-page');
      const a = li.querySelector('a');
      if (navId && NAV_HREF_MAP['index.html'][navId] !== undefined) {
        data.navItems.push({ id: navId, label: a ? a.innerHTML.trim() : li.textContent.trim() });
      } else {
        // Unrecognised / custom nav item — carry over verbatim
        data.navItems.push({ id: null, raw: li.outerHTML });
      }
    });
  }
  const emblemEl = clone.querySelector('.nav-emblem');
  const navNameEl = clone.querySelector('.nav-name');
  const footerLeftEl = clone.querySelector('.footer-left');
  const footerVisitorsEl = clone.querySelector('.footer-visitors');
  const footerUsydEl = clone.querySelector('.footer-usyd');

  if (emblemEl) {
    data.emblem = emblemEl.innerHTML.trim();
    // Also carry the emblem's own style attribute (background-image url,
    // sizing, etc.) — a logo image lives there, not in the innerHTML text.
    data.emblemStyle = emblemEl.getAttribute('style') || '';
  }
  if (navNameEl) {
    data.navName = navNameEl.innerHTML.trim();
    data.navNameStyle = navNameEl.getAttribute('style') || '';
  }
  if (footerLeftEl) {
    data.footerLeft = footerLeftEl.innerHTML.trim();
    data.footerLeftStyle = footerLeftEl.getAttribute('style') || '';
  }
  if (footerVisitorsEl) data.footerVisitors = footerVisitorsEl.outerHTML;
  if (footerUsydEl) {
    data.footerUsyd = footerUsydEl.innerHTML.trim();
    data.footerUsydStyle = footerUsydEl.getAttribute('style') || '';
  }

  return data;
}

function buildNavLinksHTML(navItems, targetFile) {
  const hrefMap = NAV_HREF_MAP[targetFile];
  const activeId = ACTIVE_ON[targetFile];
  const lis = navItems.map(item => {
    if (item.id === null) return item.raw; // custom item, carried over as-is
    const href = hrefMap[item.id];
    const cls = (item.id === activeId) ? ' class="active"' : '';
    return `    <li data-page="${item.id}"><a href="${href}"${cls}>${item.label}</a></li>`;
  });
  return '<ul class="nav-links">\n' + lis.join('\n') + '\n  </ul>';
}

async function syncHeaderFooter(clone, sourceFile) {
  const data = extractHeaderFooterData(clone);
  const targets = ALL_HTML_FILES.filter(f => f !== sourceFile);
  let syncedCount = 0;

  await Promise.all(targets.map(async targetFile => {
    try {
      const res = await fetch(SERVER + '/' + targetFile + '?nocache=' + Date.now());
      let raw = await res.text();

      // nav-links list
      const navHTML = buildNavLinksHTML(data.navItems, targetFile);
      raw = raw.replace(/<ul class="nav-links">[\s\S]*?<\/ul>/, navHTML);

      // logo emblem + name pieces — replace the whole tag (attributes included),
      // since a logo image lives in the style attribute, not just the inner text.
      if (data.emblem || data.emblemStyle) {
        const styleAttr = data.emblemStyle ? ` style="${data.emblemStyle.replace(/"/g, '&quot;')}"` : '';
        raw = raw.replace(/<div class="nav-emblem"[^>]*>[\s\S]*?<\/div>/, `<div class="nav-emblem"${styleAttr}>${data.emblem}</div>`);
      }
      if (data.navName || data.navNameStyle) {
        const styleAttr = data.navNameStyle ? ` style="${data.navNameStyle.replace(/"/g, '&quot;')}"` : '';
        raw = raw.replace(/<span class="nav-name"[^>]*>[\s\S]*?<\/span>/, `<span class="nav-name"${styleAttr}>${data.navName}</span>`);
      }

      // footer text + visitor badge — same "tolerate any attributes" fix as
      // the nav emblem/name above: these spans pick up a style="position:
      // relative..." (and sometimes a resize width/height) once edited, so a
      // regex expecting the bare, attribute-less opening tag silently stops
      // matching — on EVERY page, source and target alike — and the sync
      // becomes a permanent no-op from that point on.
      if (data.footerLeft || data.footerLeftStyle) {
        const styleAttr = data.footerLeftStyle ? ` style="${data.footerLeftStyle.replace(/"/g, '&quot;')}"` : '';
        raw = raw.replace(/<span class="footer-left"[^>]*>[\s\S]*?<\/span>/, `<span class="footer-left"${styleAttr}>${data.footerLeft}</span>`);
      }
      if (data.footerVisitors) raw = raw.replace(/<span class="footer-visitors"[\s\S]*?<\/span>/, data.footerVisitors);
      if (data.footerUsyd || data.footerUsydStyle) {
        const styleAttr = data.footerUsydStyle ? ` style="${data.footerUsydStyle.replace(/"/g, '&quot;')}"` : '';
        raw = raw.replace(/<span class="footer-usyd"[^>]*>[\s\S]*?<\/span>/, `<span class="footer-usyd"${styleAttr}>${data.footerUsyd}</span>`);
      }

      const saveRes = await fetch(SERVER + '/save', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ filename: targetFile, content: raw })
      });
      const saveData = await saveRes.json();
      if (saveData.ok) syncedCount++;
    } catch (e) {
      console.warn('Header/footer sync failed for', targetFile, e);
    }
  }));

  if (syncedCount) toast(`✓ Header & footer synced to ${syncedCount} other page${syncedCount>1?'s':''}`, 'ok', 4000);

  // Update the editor's own tab labels to match any renamed nav links
  syncEditorTabLabels(data.navItems);
}

function syncEditorTabLabels(navItems) {
  navItems.forEach(item => {
    if (!item.id) return;
    const btn = document.querySelector(`.pbtn[data-navid="${item.id}"]`);
    if (btn) {
      const icon = btn.getAttribute('data-icon') || '';
      const plainLabel = item.label.replace(/<[^>]+>/g, ''); // strip any bold/italic markup for tab text
      btn.textContent = (icon ? icon + ' ' : '') + plainLabel;
    }
  });
}

/* ═══════════════════════════════════════════════
   PREVIEW — shows the current page exactly as a
   visitor would see it, with no editor chrome,
   including any unsaved edits made so far.
═══════════════════════════════════════════════ */
function buildStandaloneHTML(pg, styleCSS, extraCSSHTML) {
  const clone = pg.cloneNode(true);

  // Strip every editor-only attribute, class, and injected UI control
  clone.querySelectorAll('[contenteditable]').forEach(el => {
    el.removeAttribute('contenteditable');
    el.removeAttribute('data-cms');
    el.removeAttribute('data-draggable');
    el.classList.remove('editable','selected');
  });
  clone.querySelectorAll('.cms-move-handle, .cms-del-btn, .cms-avatar-upload, .cms-crop-btn, .cms-hero-upload, .cms-hero-crop, .cms-hero-remove, .cms-logo-upload, .cms-logo-revert, .cms-yt-btn').forEach(el => el.remove());
  clone.querySelectorAll('.nav-emblem').forEach(el => { el.removeAttribute('data-has-logo'); el.removeAttribute('data-logo-orig-name'); el.removeAttribute('data-emblem-orig-text'); el.classList.remove('avatar-drag-over'); });
  clone.querySelectorAll('.cms-new-textbox').forEach(el => el.classList.remove('cms-new-textbox'));
  clone.querySelectorAll('img[data-cms-img]').forEach(el => { el.removeAttribute('data-cms-img'); el.removeAttribute('data-orig-name'); });
  clone.querySelectorAll('svg[data-cms-svg]').forEach(el => el.removeAttribute('data-cms-svg'));
  clone.querySelectorAll('[data-cms-avatar]').forEach(el => { el.removeAttribute('data-cms-avatar'); el.removeAttribute('data-avatar-orig-name'); el.classList.remove('avatar-drag-over'); });
  clone.querySelectorAll('[data-cms-tile]').forEach(el => { el.removeAttribute('data-cms-tile'); el.removeAttribute('data-idx'); el.classList.remove('avatar-drag-over'); });
  clone.querySelectorAll('[data-cms-card]').forEach(el => el.removeAttribute('data-cms-card'));
  clone.querySelectorAll('[data-cms-hero]').forEach(el => { el.removeAttribute('data-cms-hero'); el.removeAttribute('data-hero-orig-name'); el.classList.remove('avatar-drag-over'); });
  clone.querySelectorAll('[data-replace-existing]').forEach(el => el.removeAttribute('data-replace-existing'));
  clone.querySelectorAll('img[data-orig-name]').forEach(el => el.removeAttribute('data-orig-name'));
  clone.querySelectorAll('.cms-hoverable').forEach(el => { el.classList.remove('selected','dragging'); });
  clone.querySelectorAll('li.dragging').forEach(el => { el.classList.remove('dragging'); el.style.opacity=''; });
  // Remove the editor's resize handle from the live saved output — visitors
  // shouldn't be able to resize images/tiles on the public site.
  clone.querySelectorAll('[style*="resize"]').forEach(el => {
    el.style.removeProperty('resize');
    if (el.style.overflow === 'auto' || el.style.overflow === 'hidden') el.style.removeProperty('overflow');
  });

  const ownStyles = styleCSS ? `\n  <style>\n${styleCSS}\n  </style>` : '';

  return `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICE Group · University of Sydney</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">${extraCSSHTML || ''}${ownStyles}
</head>
<body>
${clone.innerHTML}
</body>
</html>`;
}

async function previewPage() {
  if (!serverOnline) {
    toast('Start the server (START_EDITOR.bat) first — Preview needs it to load styling and images', 'err', 5000);
    return;
  }
  const pg = document.getElementById('pg-'+cur);
  const html = buildStandaloneHTML(pg, pageStyles[cur], extraCSSLinksHTML(cur));

  try {
    // Hand the fully-rendered HTML to the local server, which serves it
    // back at a real URL (/preview) — this guarantees relative paths for
    // css/style.css and images resolve exactly like any other saved page.
    const res = await fetch(SERVER + '/preview', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ html })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Unknown error');

    const win = window.open(SERVER + '/preview?t=' + Date.now(), '_blank');
    if (!win) {
      toast('Pop-up blocked — allow pop-ups for this page to preview', 'err');
      return;
    }
    toast('👁 Preview opened in a new tab (includes unsaved edits)', 'ok');
  } catch (e) {
    toast('Preview failed: ' + e.message, 'err');
  }
}

/* ═══════════════════════════════════════════════
   SAVE — writes directly to disk via server
═══════════════════════════════════════════════ */
async function savePage() {
  const btn = document.getElementById('btn-save');
  const pg  = document.getElementById('pg-'+cur);
  const clone = pg.cloneNode(true);

  // If the server is online, upload any drag-and-dropped images (currently
  // embedded as base64 data URLs) to images/<Tab>/ and swap in real file
  // paths, so the saved HTML references actual image files, not base64 blobs.
  if (serverOnline) {
    const uploadFolder = UPLOAD_FOLDERS[cur] || 'uploads';
    const dataImgs = [...clone.querySelectorAll('img[src^="data:"]')];
    if (dataImgs.length) {
      btn.className = 'bar-btn saving'; btn.textContent = '⏳ Uploading images…';
      for (const img of dataImgs) {
        const origName = img.getAttribute('data-orig-name') || (img.alt || 'image') + '.png';
        const overwrite = img.getAttribute('data-replace-existing') === '1';
        try {
          const res = await fetch(SERVER + '/upload-image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename: origName, dataUrl: img.getAttribute('src'), folder: uploadFolder, overwrite })
          });
          const data = await res.json();
          if (data.ok) {
            img.setAttribute('src', data.path);
            img.removeAttribute('data-orig-name');
            img.removeAttribute('data-replace-existing');
            // Also update the live (non-cloned) image so it doesn't re-upload next save
            const liveMatch = pg.querySelector(`img[data-orig-name="${origName}"]`);
            if (liveMatch) { liveMatch.setAttribute('src', data.path); liveMatch.removeAttribute('data-orig-name'); liveMatch.removeAttribute('data-replace-existing'); }
          }
        } catch (e) {
          console.warn('Image upload failed for', origName, e);
        }
      }
    }

    // Also upload any avatar-sphere headshots or hero banner images (stored as
    // a CSS background-image data URL rather than an <img> tag). Avatars always
    // go to images/Headshots/; the hero banner goes to images/<Tab>/ like any
    // other image on that page.
    // NOTE: match on ANY style attribute containing a data: URL, not just ones
    // with the literal substring "background-image" — when an avatar already
    // has a photo (rendered with the CSS *shorthand* `background: url(...)
    // center / cover`), setting el.style.backgroundImage on top makes Chrome
    // re-serialize the whole declaration back into that same shorthand, so a
    // selector looking only for "background-image" silently misses it, the
    // upload never happens, and the raw base64 data gets baked into the saved
    // HTML untouched instead.
    const bgDataEls = [...clone.querySelectorAll('[style]')]
      .filter(el => /url\(["']?data:image\//.test(el.getAttribute('style') || ''));
    if (bgDataEls.length) {
      btn.className = 'bar-btn saving'; btn.textContent = '⏳ Uploading images…';
      for (const el of bgDataEls) {
        const styleAttr = el.getAttribute('style') || '';
        const match = styleAttr.match(/url\((["']?)(data:image\/[^)"']+)\1\)/);
        if (!match) continue;
        const dataUrl = match[2];
        const isHero = el.hasAttribute('data-cms-hero');
        const isLogo = el.classList.contains('nav-emblem');
        const folder = isHero ? uploadFolder : (isLogo ? 'Branding' : 'Headshots');
        const origNameAttr = isHero ? 'data-hero-orig-name' : (isLogo ? 'data-logo-orig-name' : 'data-avatar-orig-name');
        const origName = el.getAttribute(origNameAttr) || (isHero ? 'hero.jpg' : (isLogo ? 'logo.png' : 'headshot.png'));
        const overwrite = el.getAttribute('data-replace-existing') === '1';
        try {
          const res = await fetch(SERVER + '/upload-image', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ filename: origName, dataUrl, folder, overwrite })
          });
          const data = await res.json();
          if (data.ok) {
            const newStyle = styleAttr.replace(match[0], `url('${data.path}')`);
            el.setAttribute('style', newStyle);
            el.removeAttribute(origNameAttr);
            el.removeAttribute('data-replace-existing');
            // Also update the live (non-cloned) element so it doesn't re-upload next save
            const liveMatch = pg.querySelector(`[${origNameAttr}="${origName}"]`);
            if (liveMatch) {
              liveMatch.setAttribute('style', (liveMatch.getAttribute('style')||'').replace(match[0], `url('${data.path}')`));
              liveMatch.removeAttribute(origNameAttr);
              liveMatch.removeAttribute('data-replace-existing');
            }
          }
        } catch (e) {
          console.warn('Image upload failed for', origName, e);
        }
      }
    }
  }

  // Snapshot Gallery/Photos tile data (photo file + caption, keyed by their
  // data-idx into the data/*.js array) now, while image src's are already
  // resolved to real server paths — the stripping pass just below removes
  // data-idx (along with other editor-only attributes) from the clone, so
  // this must happen first, not after.
  // Caption text is read from TEXT NODES ONLY (not .textContent), because the
  // caption span is itself an editable element with move/delete-handle glyphs
  // (✥ ✕) appended as child elements — .textContent would pull those in too.
  const readCaptionText = el => !el ? null : [...el.childNodes]
    .filter(n => n.nodeType === Node.TEXT_NODE)
    .map(n => n.textContent).join('').trim();

  // Team grid (index.html "#teamGridHome .person-card" / people.html
  // "#teamGridPeople .member-card") — both pages render it from data/team.js
  // on load, so an edited name/role/avatar must be written back there too,
  // same problem as Gallery/Photos/Publications above. The two pages use
  // different class prefixes and index.html's cards don't visually encode
  // the "lead" flag at all, so we only touch fields the current page's DOM
  // actually represents, leaving the rest of each entry exactly as
  // data/team.js already has it.
  let teamSyncData = null;
  if (cur === 'home' || cur === 'people') {
    const prefix = cur === 'home' ? 'person' : 'member';
    const gridId = cur === 'home' ? 'teamGridHome' : 'teamGridPeople';
    teamSyncData = [...clone.querySelectorAll(`#${gridId} .${prefix}-card`)].map(card => {
      const roleA = card.querySelector(`.${prefix}-role a`);
      if (roleA) {
        return {
          open: true,
          role: readCaptionText(card.querySelector(`.${prefix}-name`)) || '',
          linkText: readCaptionText(roleA) || '',
          link: roleA.getAttribute('href') || '',
        };
      }
      const avatar = card.querySelector(`.${prefix}-avatar`);
      const avatarStyle = avatar ? (avatar.getAttribute('style') || '') : '';
      const urlMatch = avatarStyle.match(/url\((["']?)([^)"']+)\1\)/);
      const hasRealPhoto = urlMatch && !urlMatch[2].startsWith('data:');
      const stillPendingUpload = urlMatch && urlMatch[2].startsWith('data:');
      const result = {
        open: false,
        name: readCaptionText(card.querySelector(`.${prefix}-name`)) || '',
        role: readCaptionText(card.querySelector(`.${prefix}-role`)) || '',
      };
      if (hasRealPhoto) {
        result.photoKnown = true;
        result.photo = urlMatch[2].replace(/^images\/Headshots\//, '');
      } else if (!stillPendingUpload) {
        // No url() at all — rendering via a plain color/gradient instead.
        result.photoKnown = true;
        result.photo = '';
        const bgMatch = avatarStyle.match(/background:\s*([^;]+);?/);
        result.colorKnown = true;
        result.color = bgMatch ? bgMatch[1].trim() : '';
        result.initials = readCaptionText(avatar) || '';
      }
      // else: still a data: URL at snapshot time (upload didn't resolve in
      // time, shouldn't normally happen) — leave photo/color/initials alone
      // rather than risk overwriting good data with something ambiguous.

      // Only people.html's cards encode "lead" visually (a left border) — on
      // index.html we simply don't touch the existing lead value at all.
      if (prefix === 'member') {
        result.leadKnown = true;
        result.lead = /border-left:\s*3px\s+solid/.test(card.getAttribute('style') || '');
      }
      return result;
    });
  }

  // Research area cards (index.html only — a flat, always-in-order array,
  // so simple positional correspondence with data/research.js is enough).
  let researchSyncData = null;
  if (cur === 'home') {
    researchSyncData = [...clone.querySelectorAll('#researchGrid .research-card')].map(card => ({
      icon: readCaptionText(card.querySelector('.card-icon')) || '',
      title: readCaptionText(card.querySelector('.card-title')) || '',
      desc: readCaptionText(card.querySelector('.card-desc')) || '',
    }));
  }

  let gallerySyncData = null, photosSyncData = null;
  if (cur === 'gallery') {
    gallerySyncData = [...clone.querySelectorAll('#mosaic .mtile')].map(tile => {
      const img = tile.querySelector('img');
      const cap = tile.querySelector('.mtile-cap');
      // A YouTube-thumbnail hotlink (img.youtube.com) isn't a real uploaded
      // file — only treat the src as a local file if it's actually one.
      const rawSrc = img ? img.getAttribute('src') : '';
      return {
        file: rawSrc.startsWith('images/Gallery/') ? rawSrc.replace(/^images\/Gallery\//, '') : '',
        caption: readCaptionText(cap),
        youtube: tile.getAttribute('data-youtube') || '',
      };
    });
  }
  if (cur === 'photos') {
    photosSyncData = [...clone.querySelectorAll('.masonry-item')].map(tile => {
      const img = tile.querySelector('img');
      const cap = tile.querySelector('.caption-text');
      return {
        idx: parseInt(tile.getAttribute('data-idx'), 10),
        file: img ? img.getAttribute('src').replace(/^images\/Photos\//, '') : '',
        caption: readCaptionText(cap),
      };
    });
  }
  // Publications thumbnails are matched back to their data/publications.js entry by
  // a deterministic name (year + slugified title) rather than array position, since
  // — unlike Gallery/Photos — the list can be filtered/sorted, and only publications
  // that actually have a thumbnail get one; skip tiles that are still placeholders.
  let pubsSyncData = null;
  if (cur === 'pubs') {
    pubsSyncData = [...clone.querySelectorAll('.pub-thumb')]
      .map(thumb => {
        const img = thumb.querySelector('img');
        if (!img) return null;
        return {
          thumbName: thumb.getAttribute('data-thumb-name'),
          file: img.getAttribute('src').replace(/^images\/Publications\//, ''),
        };
      })
      .filter(Boolean);
  }

  // Strip editor-only attributes and injected UI controls before saving
  clone.querySelectorAll('[contenteditable]').forEach(el => {
    el.removeAttribute('contenteditable');
    el.removeAttribute('data-cms');
    el.removeAttribute('data-draggable');
    el.classList.remove('editable','selected');
  });
  clone.querySelectorAll('.cms-move-handle, .cms-del-btn, .cms-avatar-upload, .cms-crop-btn, .cms-hero-upload, .cms-hero-crop, .cms-hero-remove, .cms-logo-upload, .cms-logo-revert, .cms-yt-btn').forEach(el => el.remove());
  clone.querySelectorAll('.nav-emblem').forEach(el => { el.removeAttribute('data-has-logo'); el.removeAttribute('data-logo-orig-name'); el.removeAttribute('data-emblem-orig-text'); el.classList.remove('avatar-drag-over'); });
  clone.querySelectorAll('.cms-new-textbox').forEach(el => el.classList.remove('cms-new-textbox'));
  clone.querySelectorAll('img[data-cms-img]').forEach(el => { el.removeAttribute('data-cms-img'); el.removeAttribute('data-orig-name'); });
  clone.querySelectorAll('svg[data-cms-svg]').forEach(el => el.removeAttribute('data-cms-svg'));
  clone.querySelectorAll('[data-cms-avatar]').forEach(el => { el.removeAttribute('data-cms-avatar'); el.removeAttribute('data-avatar-orig-name'); el.classList.remove('avatar-drag-over'); });
  clone.querySelectorAll('[data-cms-tile]').forEach(el => { el.removeAttribute('data-cms-tile'); el.removeAttribute('data-idx'); el.classList.remove('avatar-drag-over'); });
  clone.querySelectorAll('[data-cms-card]').forEach(el => el.removeAttribute('data-cms-card'));
  clone.querySelectorAll('[data-cms-hero]').forEach(el => { el.removeAttribute('data-cms-hero'); el.removeAttribute('data-hero-orig-name'); el.classList.remove('avatar-drag-over'); });
  clone.querySelectorAll('[data-replace-existing]').forEach(el => el.removeAttribute('data-replace-existing'));
  clone.querySelectorAll('img[data-orig-name]').forEach(el => el.removeAttribute('data-orig-name'));
  clone.querySelectorAll('.cms-hoverable').forEach(el => { el.classList.remove('selected','dragging'); });
  clone.querySelectorAll('li.dragging').forEach(el => { el.classList.remove('dragging'); el.style.opacity=''; });
  // Remove the editor's resize handle from the live saved output — visitors
  // shouldn't be able to resize images/tiles on the public site.
  clone.querySelectorAll('[style*="resize"]').forEach(el => {
    el.style.removeProperty('resize');
    if (el.style.overflow === 'auto' || el.style.overflow === 'hidden') el.style.removeProperty('overflow');
  });

  // Re-embed this page's own <style> block (hero/section/card layout rules)
  // so the saved file keeps its formatting when reopened later.
  const ownStyles = pageStyles[cur] ? `\n  <style>\n${pageStyles[cur]}\n  </style>` : '';

  const html = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICE Group · University of Sydney</title>
  <link rel="stylesheet" href="css/style.css">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">${extraCSSLinksHTML(cur)}${ownStyles}
</head>
<body>
${clone.innerHTML}
</body>
</html>`;

  const filename = PAGE_FILES[cur];

  if (serverOnline) {
    btn.className = 'bar-btn saving'; btn.textContent='⏳ Saving…';
    try {
      const res = await fetch(SERVER+'/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename,content:html})});
      const data = await res.json();
      if (data.ok) {
        btn.className='bar-btn saved'; btn.textContent='✓ Saved!';
        document.getElementById('badge').classList.remove('on');
        toast('✓ '+filename+' saved to disk','ok');
        loaded[cur] = false; // mark for reload next visit

        // Gallery tiles are rendered from data/gallery.js on every load, so a
        // tile photo/caption saved here must be mirrored into that data file too.
        if (gallerySyncData) {
          btn.textContent = '🔄 Syncing gallery data…';
          await syncGalleryData(gallerySyncData);
        }
        // Same problem, same fix, for Photos.
        if (photosSyncData) {
          btn.textContent = '🔄 Syncing photos data…';
          await syncPhotosData(photosSyncData);
        }
        // ...and for Publications thumbnails.
        if (pubsSyncData) {
          btn.textContent = '🔄 Syncing publications data…';
          await syncPublicationsData(pubsSyncData);
        }
        // ...and for the Team grid (index.html and people.html both share data/team.js).
        if (teamSyncData) {
          btn.textContent = '🔄 Syncing team data…';
          await syncTeamData(teamSyncData);
        }
        // ...and for the Research area cards (index.html only).
        if (researchSyncData) {
          btn.textContent = '🔄 Syncing research data…';
          await syncResearchData(researchSyncData);
        }

        // Propagate header (logo/nav) and footer to every other page
        btn.textContent = '🔄 Syncing header/footer…';
        await syncHeaderFooter(clone, filename);
        btn.textContent = '✓ Saved!';
      } else throw new Error(data.error);
    } catch(e) {
      btn.className='bar-btn err'; btn.textContent='✗ Error';
      toast('Save failed: '+e.message,'err');
    }
    setTimeout(()=>{btn.className='bar-btn';btn.id='btn-save';btn.textContent='💾 Save page';},3000);
  } else {
    // Clipboard fallback
    try {
      await navigator.clipboard.writeText(html);
      btn.className='bar-btn saved'; btn.textContent='✓ Copied!';
      document.getElementById('badge').classList.remove('on');
      toast('Copied to clipboard — paste into '+filename,'ok');
      setTimeout(()=>{btn.className='bar-btn';btn.id='btn-save';btn.textContent='💾 Save page';},3000);
    } catch { toast('Start server for auto-save','err'); }
  }
}

/* ═══════════════════════════════════════════════
   GALLERY DATA SYNC — the Gallery page renders its tiles from
   data/gallery.js on every load (see gallery.html's own render()
   script), not from the static HTML markup. So a tile photo/caption
   saved in the editor must also be written back into that data file,
   or it silently reverts to a placeholder the next time the page loads.
═══════════════════════════════════════════════ */
async function syncGalleryData(tileData) {
  if (!tileData || !tileData.length) return;

  let raw;
  try {
    raw = await (await fetch(SERVER + '/data/gallery.js?nocache=' + Date.now())).text();
  } catch (e) { console.warn('Could not fetch data/gallery.js', e); return; }

  let GALLERY;
  try {
    ({ GALLERY } = new Function(raw + '\nreturn {GALLERY};')());
  } catch (e) { console.warn('Could not parse data/gallery.js', e); return; }

  if (!Array.isArray(GALLERY) || GALLERY.length !== tileData.length) {
    // Tile count no longer lines up 1:1 with the data file (added/removed
    // some other way) — bail out rather than risk mismatching entries.
    console.warn('Gallery tile count doesn\'t match data/gallery.js — skipping data sync');
    return;
  }

  tileData.forEach((t, i) => {
    GALLERY[i].file = t.file;
    if (t.caption != null) GALLERY[i].caption = t.caption;
    GALLERY[i].youtube = t.youtube || '';
  });

  const esc = s => String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
  const entryLines = GALLERY.map(g =>
    `  { file: "${esc(g.file)}", caption: "${esc(g.caption)}", link: "${esc(g.link)}", youtube: "${esc(g.youtube)}", category: "${esc(g.category)}", icon: "${esc(g.icon)}", size: "${esc(g.size)}" },`
  ).join('\n');

  const newRaw = raw.replace(/const GALLERY = \[[\s\S]*?\n\];/, `const GALLERY = [\n${entryLines}\n];`);
  if (newRaw === raw) { console.warn('Could not locate GALLERY array in data/gallery.js — skipping data sync'); return; }

  try {
    const res = await fetch(SERVER + '/save', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ filename: 'data/gallery.js', content: newRaw })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
  } catch (e) {
    toast('Gallery photos saved, but data/gallery.js sync failed: ' + e.message, 'err', 5000);
  }
}

/* ═══════════════════════════════════════════════
   PHOTOS DATA SYNC — same problem as Gallery: the Photos page
   renders its masonry grid from data/photos.js on every load,
   grouped and re-sorted by year, so a tile's DOM position isn't
   its data-array index — each tile carries a data-idx attribute
   for that. A tile's photo/caption saved in the editor must be
   written back to the matching data/photos.js entry, or it
   reverts to a placeholder next load.
═══════════════════════════════════════════════ */
async function syncPhotosData(tileData) {
  if (!tileData || !tileData.length) return;

  let raw;
  try {
    raw = await (await fetch(SERVER + '/data/photos.js?nocache=' + Date.now())).text();
  } catch (e) { console.warn('Could not fetch data/photos.js', e); return; }

  let PHOTOS;
  try {
    ({ PHOTOS } = new Function(raw + '\nreturn {PHOTOS};')());
  } catch (e) { console.warn('Could not parse data/photos.js', e); return; }

  if (!Array.isArray(PHOTOS) || tileData.length !== PHOTOS.length) {
    // Most likely a category/year filter was active when saving, so the DOM
    // doesn't hold every tile — bail out rather than risk a bad sync.
    console.warn('Photos tile count doesn\'t match data/photos.js — skipping data sync');
    return;
  }

  // Map each tile back to its original PHOTOS index via data-idx (tiles are
  // grouped and re-sorted by year in the DOM, so simple DOM order won't do).
  const byIdx = {};
  let bad = false;
  for (const t of tileData) {
    if (Number.isNaN(t.idx) || byIdx[t.idx]) { bad = true; break; }
    byIdx[t.idx] = t;
  }
  if (bad || !PHOTOS.every((_, i) => byIdx[i])) {
    console.warn('Photos tile indices don\'t line up with data/photos.js — skipping data sync');
    return;
  }

  const arrMatch = raw.match(/const PHOTOS = \[[\s\S]*?\n\];/);
  if (!arrMatch) { console.warn('Could not locate PHOTOS array in data/photos.js — skipping data sync'); return; }

  // Patch each entry object in place (regex on {...} chunks, none of which
  // nest braces) so per-year comment dividers and formatting are preserved —
  // unlike Gallery's data file, this one is hand-organised by year.
  const esc = s => String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
  let idx = -1;
  const newArrText = arrMatch[0].replace(/\{[^{}]*\}/g, chunk => {
    idx++;
    const t = byIdx[idx];
    let updated = chunk.replace(/file:\s*"(?:[^"\\]|\\.)*"/, `file: "${esc(t.file)}"`);
    if (t.caption != null) updated = updated.replace(/caption:\s*"(?:[^"\\]|\\.)*"/, `caption: "${esc(t.caption)}"`);
    return updated;
  });

  const newRaw = raw.slice(0, arrMatch.index) + newArrText + raw.slice(arrMatch.index + arrMatch[0].length);
  if (newRaw === raw) return; // nothing actually changed

  try {
    const res = await fetch(SERVER + '/save', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ filename: 'data/photos.js', content: newRaw })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
  } catch (e) {
    toast('Photos saved, but data/photos.js sync failed: ' + e.message, 'err', 5000);
  }
}

/* ═══════════════════════════════════════════════
   PUBLICATIONS THUMBNAIL SYNC — same problem as Gallery/Photos,
   but matched to its data/publications.js entry by a deterministic
   name (year + slugified title, exactly mirroring publications.html's
   own slugify()) instead of array position — the publications list is
   commonly filtered/sorted, and only entries that actually have a
   thumbnail need one, so a position-based match would be unreliable.
═══════════════════════════════════════════════ */
function pubSlugify(str) {
  return String(str).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '').slice(0, 40);
}

async function syncPublicationsData(thumbData) {
  if (!thumbData || !thumbData.length) return;

  let raw;
  try {
    raw = await (await fetch(SERVER + '/data/publications.js?nocache=' + Date.now())).text();
  } catch (e) { console.warn('Could not fetch data/publications.js', e); return; }

  let PUBLICATIONS;
  try {
    ({ PUBLICATIONS } = new Function(raw + '\nreturn {PUBLICATIONS};')());
  } catch (e) { console.warn('Could not parse data/publications.js', e); return; }
  if (!Array.isArray(PUBLICATIONS)) return;

  // thumbName -> new filename, from tiles that actually have an image set
  const byName = {};
  thumbData.forEach(t => { if (t.thumbName) byName[t.thumbName] = t.file; });

  const arrMatch = raw.match(/const PUBLICATIONS = \[[\s\S]*?\n\];/);
  if (!arrMatch) { console.warn('Could not locate PUBLICATIONS array in data/publications.js — skipping data sync'); return; }

  const esc = s => String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/"/g, '\\"');
  let idx = -1;
  const newArrText = arrMatch[0].replace(/\{[^{}]*\}/g, chunk => {
    idx++;
    const p = PUBLICATIONS[idx];
    if (!p) return chunk;
    const thumbName = `${p.year}-${pubSlugify(p.title)}.jpg`;
    if (!(thumbName in byName)) return chunk; // this entry's tile wasn't touched — leave as-is
    const newFile = byName[thumbName];
    if (/thumbnail:\s*"(?:[^"\\]|\\.)*"/.test(chunk)) {
      return chunk.replace(/thumbnail:\s*"(?:[^"\\]|\\.)*"/, `thumbnail: "${esc(newFile)}"`);
    }
    // no "thumbnail" field yet on this entry — add one, just before the closing brace
    return chunk.replace(/\s*\}$/, `,\n    thumbnail: "${esc(newFile)}"\n  }`);
  });

  const newRaw = raw.slice(0, arrMatch.index) + newArrText + raw.slice(arrMatch.index + arrMatch[0].length);
  if (newRaw === raw) return; // nothing actually changed

  try {
    const res = await fetch(SERVER + '/save', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ filename: 'data/publications.js', content: newRaw })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
  } catch (e) {
    toast('Thumbnail saved, but data/publications.js sync failed: ' + e.message, 'err', 5000);
  }
}

/* ═══════════════════════════════════════════════
   TEAM DATA SYNC — same problem as Gallery/Photos/Publications:
   both index.html and people.html render "The Team" grid from
   data/team.js on every load, so a name/role/avatar edited in
   the editor must be written back there too, or it reverts on
   the next load (including just switching tabs and back inside
   the editor itself, since that re-runs the page's own script).

   The two pages use different CSS class prefixes and only
   people.html's cards visually encode the "lead" flag (a left
   border) — index.html's don't show it at all — so each card's
   snapshot only sets the fields that page's DOM actually
   represents (marked with a "*Known" flag); anything else is
   left exactly as data/team.js already has it, rather than
   risking overwriting good data with a blank guess.
═══════════════════════════════════════════════ */
async function syncTeamData(cardData) {
  if (!cardData || !cardData.length) return;

  let raw;
  try {
    raw = await (await fetch(SERVER + '/data/team.js?nocache=' + Date.now())).text();
  } catch (e) { console.warn('Could not fetch data/team.js', e); return; }

  let TEAM;
  try {
    ({ TEAM } = new Function(raw + '\nreturn {TEAM};')());
  } catch (e) { console.warn('Could not parse data/team.js', e); return; }

  if (!Array.isArray(TEAM) || cardData.length < TEAM.length) {
    // Fewer cards in the DOM than entries in the data file — the grid
    // probably didn't fully render, or a member was removed some other
    // way. Bail out rather than risk deleting/mismatching entries.
    // (cardData.length > TEAM.length is fine — that's a new member added
    // via "Add team member", handled as a new entry below.)
    console.warn('Team card count doesn\'t match data/team.js — skipping data sync');
    return;
  }

  cardData.forEach((c, i) => {
    let m = TEAM[i];
    if (!m) { m = {}; TEAM[i] = m; } // a new card beyond the existing entries
    if (c.open) {
      TEAM[i] = { open: true, role: c.role, linkText: c.linkText, link: c.link };
      return;
    }
    m.name = c.name;
    m.role = c.role;
    delete m.open;
    if (c.photoKnown) m.photo = c.photo;
    if (c.colorKnown) m.color = c.color;
    if (c.initials != null && c.photoKnown && !c.photo) m.initials = c.initials;
    if (c.leadKnown) { if (c.lead) m.lead = true; else delete m.lead; }
  });

  const entryLines = TEAM.map(m => {
    if (m.open) {
      return `  { open: true, role: ${JSON.stringify(m.role || '')}, linkText: ${JSON.stringify(m.linkText || '')}, link: ${JSON.stringify(m.link || '')} },`;
    }
    const parts = [`name: ${JSON.stringify(m.name || '')}`, `role: ${JSON.stringify(m.role || '')}`];
    if (m.lead) parts.push('lead: true');
    parts.push(`photo: ${JSON.stringify(m.photo || '')}`);
    parts.push(`initials: ${JSON.stringify(m.initials || '')}`);
    parts.push(`color: ${JSON.stringify(m.color || '')}`);
    return `  { ${parts.join(', ')} },`;
  }).join('\n');

  const arrMatch = raw.match(/const TEAM = \[[\s\S]*?\n\];/);
  if (!arrMatch) { console.warn('Could not locate TEAM array in data/team.js — skipping data sync'); return; }

  const newRaw = raw.slice(0, arrMatch.index) + `const TEAM = [\n${entryLines}\n];` + raw.slice(arrMatch.index + arrMatch[0].length);
  if (newRaw === raw) return; // nothing actually changed

  try {
    const res = await fetch(SERVER + '/save', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ filename: 'data/team.js', content: newRaw })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
  } catch (e) {
    toast('Team saved, but data/team.js sync failed: ' + e.message, 'err', 5000);
  }
}

/* ═══════════════════════════════════════════════
   RESEARCH AREA CARDS SYNC — index.html renders these from
   data/research.js on every load, so a card's icon/title/
   description edited in the editor must be written back there

  }

/* ═══════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════ */
function toast(msg, type='', ms=3500) {
  const t = document.getElementById('toast');
  t.textContent=msg; t.className='on'+(type?' '+type:'');
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.className='',ms);
}
