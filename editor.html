<script>
/* ═══════════════════════════════════════════════
   CONFIG
═══════════════════════════════════════════════ */
const SERVER = 'http://localhost:8000';
const PAGE_FILES = {
  home:'index.html', news:'news.html', people:'people.html',
  pubs:'publications.html', alumni:'alumni.html', photos:'photos.html',
  gallery:'gallery.html', abstracts:'abstracts.html'
};

// Which images/<Folder>/ an uploaded image goes into, based on the page it was dropped on.
const UPLOAD_FOLDERS = {
  home:'Home', news:'News', people:'People', pubs:'Publications',
  alumni:'Alumni', photos:'Photos', gallery:'Gallery', abstracts:'Abstracts'
};

// Every target FILE we might need to sync header/footer into (keyed by nav-id filename, not editor page-id)
const ALL_HTML_FILES = ['index.html','news.html','people.html','publications.html','alumni.html','photos.html','gallery.html','abstracts.html'];

// Correct href for each standard nav item, depending on which file it appears in.
const NAV_HREF_MAP = {
  'index.html': { research:'#research', people:'people.html', publications:'publications.html', alumni:'alumni.html', news:'news.html', photos:'photos.html', gallery:'gallery.html', abstracts:'abstracts.html', join:'#contact' }
};
ALL_HTML_FILES.forEach(f => {
  if (f !== 'index.html') {
    NAV_HREF_MAP[f] = { research:'index.html#research', people:'people.html', publications:'publications.html', alumni:'alumni.html', news:'news.html', photos:'photos.html', gallery:'gallery.html', abstracts:'abstracts.html', join:'index.html#contact' };
  }
});
// Which nav-id should get the "active" class on which file
const ACTIVE_ON = { 'people.html':'people', 'publications.html':'publications', 'alumni.html':'alumni', 'news.html':'news', 'photos.html':'photos', 'gallery.html':'gallery', 'abstracts.html':'abstracts' };

let cur = 'home';
let serverOnline = false;
let hist = [];
let selEl = null;
let loaded = {}; // track which pages have been fetched
let pageStyles = {}; // per-page <style> block contents, keyed by page id
let pageExternalCSS = {}; // per-page extra <link rel="stylesheet"> hrefs (e.g. a map library), keyed by page id

// Shared by buildStandaloneHTML() and savePage() so any extra stylesheet a
// page links to (e.g. Leaflet for the Alumni collaborators map) survives
// being saved, instead of only the two hardcoded <link> tags.
function extraCSSLinksHTML(id) {
  return (pageExternalCSS[id] || []).map(href => `\n  <link rel="stylesheet" href="${href}">`).join('');
}
let pageHeadExtras = {}; // per-page extra <head> tags (meta, title) keyed by page id

/* ═══════════════════════════════════════════════
   SERVER CHECK
═══════════════════════════════════════════════ */
async function checkServer() {
  try {
    await fetch(SERVER+'/save',{method:'OPTIONS',signal:AbortSignal.timeout(1500)});
    serverOnline = true;
  } catch { serverOnline = false; }
  document.getElementById('srv-dot').className = serverOnline ? 'on' : 'off';
  document.getElementById('srv-lbl').textContent = serverOnline ? 'server on' : 'offline';
  document.getElementById('srv-lbl').style.color = serverOnline ? 'rgba(26,158,107,0.7)' : 'rgba(224,90,75,0.5)';
  document.getElementById('offline-banner').className = serverOnline ? '' : 'show';
  document.getElementById('frame').className = serverOnline ? '' : 'banner-up';
}
checkServer();
setInterval(checkServer, 5000);

/* ═══════════════════════════════════════════════
   LOAD PAGE FROM DISK (always fresh)
═══════════════════════════════════════════════ */
async function loadPage(id) {
  const filename = PAGE_FILES[id];
  const container = document.getElementById('pg-' + id);
  if (!serverOnline) {
    // fallback static content if server offline
    if (!container.innerHTML.trim()) {
      container.innerHTML = `<div style="padding:3rem;text-align:center;color:#567a96">
        <p style="font-size:1.1rem;margin-bottom:.5rem">Start the server to load live page content</p>
        <p style="font-size:12px">Double-click <strong>START_EDITOR.bat</strong>, then refresh this page</p>
      </div>`;
    }
    return;
  }
  try {
    const res = await fetch(SERVER + '/' + filename + '?nocache=' + Date.now());
    let html = await res.text();

    // Extract the page's own <style> blocks from its <head> and inject them
    // so the page renders with its real formatting (colours, layout, fonts).
    const headMatch = html.match(/<head[^>]*>([\s\S]*?)<\/head>/i);
    const headHTML = headMatch ? headMatch[1] : '';
    const styleBlocks = [...headHTML.matchAll(/<style[^>]*>([\s\S]*?)<\/style>/gi)]
      .map(m => m[1]).join('\n\n');
    document.getElementById('page-styles').textContent = styleBlocks;
    pageStyles[id] = styleBlocks; // remember so Save can re-embed it

    // Also bring in any external stylesheet the page's <head> links to (e.g. a
    // map library's CSS) — inject a real <link> into the editor's own head so
    // it actually renders while editing, not just when the file is opened
    // directly in a browser. Dedup by href so switching pages repeatedly
    // doesn't pile up duplicate <link> tags.
    const linkHrefs = [...headHTML.matchAll(/<link[^>]+rel=["']stylesheet["'][^>]*>/gi)]
      .map(tag => (tag[0].match(/href=["']([^"']+)["']/) || [])[1])
      .filter(Boolean);
    linkHrefs.forEach(href => {
      if (!document.querySelector(`link[data-cms-external-css="${href}"]`)) {
        const link = document.createElement('link');
        link.rel = 'stylesheet';
        link.href = href;
        link.setAttribute('data-cms-external-css', href);
        document.head.appendChild(link);
      }
    });
    pageExternalCSS[id] = linkHrefs; // remember so Save/Preview can re-embed these too

    // Strip doctype/html/head/body wrappers — extract body content only
    const bodyMatch = html.match(/<body[^>]*>([\s\S]*)<\/body>/i);
    container.innerHTML = bodyMatch ? bodyMatch[1] : html;

    // Collect every <script> on the page (both inline and external data/*.js
    // files) and execute them together in one isolated function scope. This
    // is essential: these pages declare top-level `const`/`let` (e.g.
    // `const PUBLICATIONS = [...]`), and simply re-inserting <script> tags on
    // every visit redeclares those bindings in the shared global scope,
    // which throws a SyntaxError and silently kills the page's rendering
    // after the first visit.
    //
    // CRITICAL: we do NOT remove or replace the original <script> tags in
    // the DOM. Doing so used to mean that clicking Save captured a page with
    // its data permanently baked in and its <script src="data/news.js">
    // reference destroyed — so future edits to data/news.js would silently
    // stop taking effect. Instead we leave the original tags exactly as
    // they are (they stay inert; setting innerHTML never auto-executes
    // them) and run the combined code via `new Function()`, which needs no
    // script element in the DOM at all.
    const scriptEls = [...container.querySelectorAll('script')];
    let combinedJS = '';
    for (const oldScript of scriptEls) {
      if (oldScript.src) {
        try {
          const srcAttr = oldScript.getAttribute('src');
          // Absolute URLs (e.g. a CDN-hosted library) are fetched directly;
          // local paths (e.g. data/alumni.js) go through the local server.
          const fetchUrl = /^https?:\/\//i.test(srcAttr)
            ? srcAttr
            : SERVER + '/' + srcAttr + '?nocache=' + Date.now();
          const scriptRes = await fetch(fetchUrl);
          combinedJS += '\n' + (await scriptRes.text()) + '\n';
        } catch (e) {
          console.warn('Could not fetch script', oldScript.getAttribute('src'), e);
        }
      } else {
        combinedJS += '\n' + oldScript.textContent + '\n';
      }
      // Original script tag is left in place, untouched — not removed, not replaced.
    }
    if (combinedJS.trim()) {
      try {
        new Function(combinedJS)();
      } catch (e) {
        console.error('Error running page script for', filename, e);
      }
    }

    // Give dynamically-rendered content (e.g. publications/news/photos scripts) a moment to run
    setTimeout(() => initEditing(id), 120);
  } catch(e) {
    container.innerHTML = `<div style="padding:2rem;color:#e05a4b">Could not load ${filename}: ${e.message}</div>`;
  }
}

/* ═══════════════════════════════════════════════
   PAGE SWITCH
═══════════════════════════════════════════════ */
async function go(id, btn) {
  document.querySelectorAll('.pg').forEach(p => p.classList.remove('on'));
  document.querySelectorAll('.pbtn').forEach(b => b.classList.remove('on'));
  document.getElementById('pg-'+id).classList.add('on');
  btn.classList.add('on');
  cur = id;
  selEl = null;
  window.scrollTo(0,0);
  await loadPage(id);
}

// "Research" and "Join Us" aren't separate files — they're sections within
// the Home page. This switches to Home (loading it if needed) and then
// scrolls straight to the requested section, so they're still reachable
// as one click from the tab bar.
async function goToSection(anchorId, btn) {
  const homeBtn = document.querySelector('.pbtn[onclick*="go(\'home\'"]');
  if (cur !== 'home') {
    await go('home', homeBtn);
  }
  document.querySelectorAll('.pbtn').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  setTimeout(() => {
    const target = document.getElementById(anchorId) || document.querySelector('#pg-home [id="' + anchorId + '"]');
    if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }, 200);
}

/* ═══════════════════════════════════════════════
   MAKE ELEMENTS EDITABLE
═══════════════════════════════════════════════ */
// ── shared helper: attach move + delete handles to any element ──
// (top-level, not nested in initEditing, so other functions like
// triggerAddTeamMember can reuse it too)
function attachHandles(el, opts) {
  opts = opts || {};
  const moveHandle = document.createElement('span');
  moveHandle.className = 'cms-move-handle';
  moveHandle.setAttribute('contenteditable','false');
  moveHandle.title = (opts.reorderUl || opts.gridReorder) ? 'Drag to reorder' : 'Drag to move';
  moveHandle.textContent = '✥';
  el.appendChild(moveHandle);
  moveHandle.addEventListener('mousedown', e => {
    e.preventDefault(); e.stopPropagation();
    if (opts.reorderUl) beginNavReorderDrag(el, opts.reorderUl, e);
    else if (opts.gridReorder) beginTileReorderDrag(el, opts.gridReorder, e);
    else beginElementDrag(el, e);
  });

  if (opts.moveOnly) return; // no delete cross for this element

  const delBtn = document.createElement('span');
  delBtn.className = 'cms-del-btn';
  delBtn.setAttribute('contenteditable','false');
  delBtn.title = 'Delete this element';
  delBtn.textContent = '✕';
  el.appendChild(delBtn);
  delBtn.addEventListener('mousedown', e => e.stopPropagation());
  delBtn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); deleteElement(el); });
}

function initEditing(id) {
  const pg = document.getElementById('pg-'+id);
  const tags = ['p','h1','h2','h3','h4','h5','span','em','strong','li','td','a'];

  // ── text elements (paragraphs, headings, spans, links, list items…) ──
  pg.querySelectorAll(tags.join(',')).forEach(el => {
    if (['INPUT','TEXTAREA','SELECT','BUTTON'].includes(el.tagName)) return;
    if (el.hasAttribute('data-cms')) return;
    if (el.closest('[data-cms-skip]')) return; // e.g. visitor counter badge, embedded map controls — not editable
    if (!el.textContent.trim()) return;
    if (el.querySelectorAll(tags.join(',')).length > 2) return;

    // Tile containers (Gallery/Photos/News grid items) are handled as a
    // whole unit by initTiles() below — don't also make the container
    // itself directly contenteditable (it may be an <a> tag).
    if (el.classList.contains('mtile') || el.classList.contains('masonry-item') || el.classList.contains('news-card')) return;

    // Anchors inside nav-links <li> are edited via their parent <li> instead
    // (avoids double handles on the same visible nav item).
    const navLi = el.closest('.nav-links li');
    if (el.tagName === 'A' && navLi && el.parentElement === navLi) return;

    // The "ICE Group · University of Sydney" header text has two nested
    // spans purely for coloring — edit it as ONE text box (the outer
    // .nav-name), not three overlapping ones.
    if (el.closest('.nav-name') && el !== el.closest('.nav-name')) return;

    // Its wrapping <a> (a plain "click logo to go home" link with no text
    // of its own) shouldn't get its own separate, overlapping edit controls.
    if (el.tagName === 'A' && el.querySelector(':scope > .nav-name')) return;

    el.setAttribute('data-cms','1');
    el.setAttribute('contenteditable','true');
    el.classList.add('editable');

    // The header brand text sits inside a "click logo to go home" <a> link —
    // stop that link from firing while editing it (same fix as Gallery tiles).
    if (el.classList.contains('nav-name')) {
      el.addEventListener('click', e => e.preventDefault());
    }

    const isNavLi = el.tagName === 'LI' && el.closest('.nav-links');
    // Always establish a positioning context so the move/delete handles
    // anchor correctly to this element's own corner (even nav li's, which
    // use DOM reordering rather than left/top offsets for movement).
    if (!el.style.position || el.style.position === 'static') {
      el.style.position = 'relative';
    }
    attachHandles(el, isNavLi ? { reorderUl: el.closest('.nav-links') } : {});

    el.addEventListener('focus', () => {
      selEl = el;
      document.querySelectorAll('.editable').forEach(e => e.classList.remove('selected'));
      el.classList.add('selected');
      hist.push({el, prev: el.innerHTML, action:'edit'});
      document.getElementById('badge').classList.add('on');
    });
    el.addEventListener('input', () => document.getElementById('badge').classList.add('on'));
    el.addEventListener('keydown', e => {
      if (e.key==='Escape') { el.blur(); }
    });
  });

  // ── logo emblem ("ICE" square) — a <div>, not covered by the tag list above.
  // Editable as text (default "ICE" mark), and also upload-able as your own
  // logo image — same upload/revert pattern used by avatars/hero banner, just
  // sized and positioned for this small icon. ──
  pg.querySelectorAll('.nav-emblem').forEach(el => {
    if (el.hasAttribute('data-cms')) return;
    el.setAttribute('data-cms','1');
    el.setAttribute('contenteditable','true');
    el.classList.add('editable');
    if (!el.style.position || el.style.position === 'static') el.style.position = 'relative';
    attachHandles(el);
    el.addEventListener('focus', () => {
      selEl = el;
      document.querySelectorAll('.editable').forEach(e => e.classList.remove('selected'));
      el.classList.add('selected');
      hist.push({el, prev: el.innerHTML, action:'edit'});
      document.getElementById('badge').classList.add('on');
    });
    el.addEventListener('input', () => document.getElementById('badge').classList.add('on'));

    // Remember the original "ICE" text so a logo image can be reverted back to it later.
    if (!el.hasAttribute('data-emblem-orig-text')) {
      const origText = [...el.childNodes].filter(n => n.nodeType === Node.TEXT_NODE).map(n => n.textContent).join('').trim();
      el.setAttribute('data-emblem-orig-text', origText || 'ICE');
    }
    // If this page was reloaded and already has a logo image set, flag it so
    // the revert button shows immediately (no hover/select needed first).
    if (el.style.backgroundImage && el.style.backgroundImage !== 'none') el.setAttribute('data-has-logo', '1');

    // upload button (🖼) — replace the "ICE" text with your own logo image
    const logoBtn = document.createElement('span');
    logoBtn.className = 'cms-logo-upload';
    logoBtn.setAttribute('contenteditable','false');
    logoBtn.title = 'Upload your own group logo';
    logoBtn.textContent = '🖼';
    el.appendChild(logoBtn);
    logoBtn.addEventListener('mousedown', e => e.stopPropagation());
    logoBtn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      triggerLogoUpload(el);
    });

    // revert button (↺) — only shown once a custom logo image is actually set
    const logoRevertBtn = document.createElement('span');
    logoRevertBtn.className = 'cms-logo-revert';
    logoRevertBtn.setAttribute('contenteditable','false');
    logoRevertBtn.title = 'Remove logo image, revert to "ICE" text';
    logoRevertBtn.textContent = '↺';
    el.appendChild(logoRevertBtn);
    logoRevertBtn.addEventListener('mousedown', e => e.stopPropagation());
    logoRevertBtn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      revertLogoImage(el);
    });

    // also allow dropping an image file straight onto the emblem
    el.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); el.classList.add('avatar-drag-over'); });
    el.addEventListener('dragleave', () => el.classList.remove('avatar-drag-over'));
    el.addEventListener('drop', e => {
      e.preventDefault(); e.stopPropagation();
      el.classList.remove('avatar-drag-over');
      const file = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
      if (file) setLogoImage(el, file);
    });
  });

  // ── avatar spheres (PI / PD / PhD / initials) — editable text + upload-a-headshot ──
  pg.querySelectorAll('[class*="avatar"]').forEach(el => {
    if (el.hasAttribute('data-cms-avatar')) return;
    if (el.closest('[data-cms-skip]')) return;
    el.setAttribute('data-cms-avatar','1');
    el.setAttribute('contenteditable','true');
    el.classList.add('editable');
    if (!el.style.position || el.style.position === 'static') el.style.position = 'relative';
    attachHandles(el, { moveOnly: true });

    el.addEventListener('focus', () => {
      selEl = el;
      document.querySelectorAll('.editable').forEach(e => e.classList.remove('selected'));
      el.classList.add('selected');
      hist.push({el, prev: el.innerHTML, prevStyle: el.getAttribute('style'), action:'edit'});
      document.getElementById('badge').classList.add('on');
    });
    el.addEventListener('input', () => document.getElementById('badge').classList.add('on'));

    // camera button — click to pick a headshot photo
    const camBtn = document.createElement('span');
    camBtn.className = 'cms-avatar-upload';
    camBtn.setAttribute('contenteditable','false');
    camBtn.title = 'Upload a headshot photo';
    camBtn.textContent = '📷';
    el.appendChild(camBtn);
    camBtn.addEventListener('mousedown', e => e.stopPropagation());
    camBtn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      triggerAvatarUpload(el);
    });

    // crop button — only meaningful once a real headshot photo is set
    const cropBtn = document.createElement('span');
    cropBtn.className = 'cms-crop-btn';
    cropBtn.setAttribute('contenteditable', 'false');
    cropBtn.title = 'Crop this headshot';
    cropBtn.textContent = '✂';
    el.appendChild(cropBtn);
    cropBtn.addEventListener('mousedown', e => e.stopPropagation());
    cropBtn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      const styleAttr = el.getAttribute('style') || '';
      const match = styleAttr.match(/url\((["']?)([^)"']+)\1\)/);
      if (!match) { toast('Add a headshot photo first (📷), then crop it', 'err'); return; }
      const tmp = new Image();
      tmp.onload = () => {
        openCropTool(tmp, dataUrl => {
          hist.push({ el, prevStyle: el.getAttribute('style'), action: 'avatarCrop' });
          const freshStyle = (el.getAttribute('style') || '').replace(match[0], `url('${dataUrl}')`);
          el.setAttribute('style', freshStyle);
          el.setAttribute('data-avatar-orig-name', (el.getAttribute('data-avatar-orig-name') || 'headshot') + '-cropped.png');
          el.removeAttribute('data-replace-existing');
          document.getElementById('badge').classList.add('on');
        });
      };
      tmp.onerror = () => toast('Could not load that photo for cropping', 'err');
      tmp.src = match[2];
    });

    // also allow dropping an image file straight onto the sphere
    el.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); el.classList.add('avatar-drag-over'); });
    el.addEventListener('dragleave', () => el.classList.remove('avatar-drag-over'));
    el.addEventListener('drop', e => {
      e.preventDefault(); e.stopPropagation();
      el.classList.remove('avatar-drag-over');
      const file = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
      if (file) setAvatarPhoto(el, file);
    });
  });

  // ── hero banner — replace the plain gradient background with an uploaded
  // image or GIF (drag-and-drop, or the small 🖼 button); works the same way
  // on every page since every page's hero uses the same .hero/.page-hero class ──
  const hero = pg.querySelector('.hero, .page-hero');
  if (hero && !hero.hasAttribute('data-cms-hero')) {
    hero.setAttribute('data-cms-hero', '1');
    if (!hero.style.position || hero.style.position === 'static') hero.style.position = 'relative';

    const heroUploadBtn = document.createElement('span');
    heroUploadBtn.className = 'cms-hero-upload';
    heroUploadBtn.setAttribute('contenteditable', 'false');
    heroUploadBtn.title = 'Add / replace the hero banner image (photos or GIFs)';
    heroUploadBtn.textContent = '🖼';
    hero.appendChild(heroUploadBtn);
    heroUploadBtn.addEventListener('mousedown', e => e.stopPropagation());
    heroUploadBtn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      triggerHeroUpload(hero);
    });

    const heroCropBtn = document.createElement('span');
    heroCropBtn.className = 'cms-hero-crop';
    heroCropBtn.setAttribute('contenteditable', 'false');
    heroCropBtn.title = 'Crop the hero banner image';
    heroCropBtn.textContent = '✂';
    hero.appendChild(heroCropBtn);
    heroCropBtn.addEventListener('mousedown', e => e.stopPropagation());
    heroCropBtn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      const styleAttr = hero.getAttribute('style') || '';
      const match = styleAttr.match(/url\((["']?)([^)"']+)\1\)/);
      if (!match) { toast('Add a hero image first (🖼), then crop it', 'err'); return; }
      const tmp = new Image();
      tmp.onload = () => {
        openCropTool(tmp, dataUrl => {
          hist.push({ el: hero, prevStyle: hero.getAttribute('style'), action: 'heroCrop' });
          setHeroBackground(hero, dataUrl);
          hero.setAttribute('data-hero-orig-name', (hero.getAttribute('data-hero-orig-name') || 'hero') + '-cropped.png');
          hero.removeAttribute('data-replace-existing');
          document.getElementById('badge').classList.add('on');
        });
      };
      tmp.onerror = () => toast('Could not load that image for cropping (animated GIFs crop to a still frame)', 'err');
      tmp.src = match[2];
    });

    const heroRemoveBtn = document.createElement('span');
    heroRemoveBtn.className = 'cms-hero-remove';
    heroRemoveBtn.setAttribute('contenteditable', 'false');
    heroRemoveBtn.title = 'Remove the hero banner image';
    heroRemoveBtn.textContent = '✕';
    hero.appendChild(heroRemoveBtn);
    heroRemoveBtn.addEventListener('mousedown', e => e.stopPropagation());
    heroRemoveBtn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      const styleAttr = hero.getAttribute('style') || '';
      if (!/background-image/.test(styleAttr)) { toast('No hero image set', 'err'); return; }
      hist.push({ el: hero, prevStyle: hero.getAttribute('style'), action: 'heroCrop' });
      clearHeroBackground(hero);
      document.getElementById('badge').classList.add('on');
      toast('Hero image removed — click 💾 Save page to store it');
    });

    hero.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); hero.classList.add('avatar-drag-over'); });
    hero.addEventListener('dragleave', () => hero.classList.remove('avatar-drag-over'));
    hero.addEventListener('drop', e => {
      e.preventDefault(); e.stopPropagation();
      hero.classList.remove('avatar-drag-over');
      const file = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
      if (file) setHeroPhotoFromFile(hero, file);
    });
  }

  // Make free-positioned elements draggable via Alt+drag (fallback) too
  initDrag(pg);

  // ── images (uploaded or already on the page) ──
  pg.querySelectorAll('img').forEach(img => {
    if (img.hasAttribute('data-cms-img')) return;
    if (img.closest('[data-cms-skip]')) return; // e.g. visitor counter badge — not editable
    if (img.closest('.mtile, .masonry-item, .news-card')) return; // handled by initTiles() instead
    if (img.closest('.pub-thumb')) return; // handled by the publications-thumbnail loop instead
    if (img.closest('.social-icon')) return; // small fixed-size badge icons (Scholar/ORCID/etc.) — the page's own CSS controls their size; leave them alone entirely so it's never overridden
    img.setAttribute('data-cms-img','1');
    img.style.cursor = 'pointer';
    img.style.display = 'block';
    img.style.height = 'auto'; // width drives the size; height always follows the image's real aspect ratio

    const wrap = document.createElement('span');
    wrap.className = 'cms-hoverable';
    wrap.style.cssText = 'position:relative;display:inline-block;';
    img.parentNode.insertBefore(wrap, img);
    wrap.appendChild(img);
    attachHandles(wrap);
    attachResizeHandle(wrap, img);
    attachCropButton(wrap, img);

    img.addEventListener('click', e => {
      e.stopPropagation();
      document.querySelectorAll('.editable,.cms-hoverable').forEach(el => el.classList.remove('selected'));
      wrap.classList.add('selected');
      selEl = img;
    });
  });

  // ── inline SVG graphics (e.g. the phase-diagram schematic) ──
  pg.querySelectorAll('svg').forEach(svg => {
    if (svg.hasAttribute('data-cms-svg')) return;
    svg.setAttribute('data-cms-svg','1');

    // Lock in current pixel size so the wrapper can be resized predictably
    const box = svg.getBoundingClientRect();
    if (box.width && box.height) {
      svg.style.width = box.width + 'px';
      svg.style.height = box.height + 'px';
    }

    const wrap = document.createElement('span');
    wrap.className = 'cms-hoverable';
    wrap.style.cssText = 'position:relative;display:inline-block;resize:both;overflow:hidden;';
    if (box.width && box.height) {
      wrap.style.width = box.width + 'px';
      wrap.style.height = box.height + 'px';
    }
    svg.parentNode.insertBefore(wrap, svg);
    wrap.appendChild(svg);
    svg.style.width = '100%';
    svg.style.height = '100%';
    attachHandles(wrap);
    trackResize(wrap);

    wrap.addEventListener('click', e => {
      e.stopPropagation();
      document.querySelectorAll('.editable,.cms-hoverable').forEach(el => el.classList.remove('selected'));
      wrap.classList.add('selected');
      selEl = svg;
    });
  });

  // ── Gallery / Photos / News grid tiles: move (reorder), resize, add-photo, crop ──
  // These tiles are rendered from a data/*.js array (GALLERY / PHOTOS / NEWS), so —
  // per the same rule applied to Publications and Abstracts — they are NOT deletable
  // from the editor: add/remove/reorder of actual entries belongs in the data file
  // itself, which is the one place a delete here would otherwise silently get
  // overwritten on reload.
  // Gallery and Photos are the exception for photo/caption edits specifically: Save
  // also writes the new photo filename + caption back into data/gallery.js /
  // data/photos.js (see syncGalleryData / syncPhotosData), so those two fields DO
  // persist across reloads for those two pages. News tile photos remain a
  // same-session-only convenience — add the resulting filename to that entry's data
  // file by hand to make it permanent.
  pg.querySelectorAll('.mtile, .masonry-item, .news-card').forEach(tile => {
    if (tile.hasAttribute('data-cms-tile')) return;
    tile.setAttribute('data-cms-tile', '1');
    if (!tile.style.position || tile.style.position === 'static') tile.style.position = 'relative';
    tile.style.resize = 'both';
    tile.style.overflow = 'hidden';

    const container = tile.parentElement;
    attachHandles(tile, { gridReorder: container, moveOnly: true });
    trackResize(tile);

    // Prevent tiles that are real links (Gallery) from navigating away while editing
    if (tile.tagName === 'A') {
      tile.addEventListener('click', e => { e.preventDefault(); });
    }

    // camera button — add / replace this tile's photo
    const camBtn = document.createElement('span');
    camBtn.className = 'cms-avatar-upload'; // reuse the same round camera-badge styling
    camBtn.setAttribute('contenteditable', 'false');
    camBtn.title = 'Add / replace this tile\'s photo';
    camBtn.textContent = '📷';
    tile.appendChild(camBtn);
    camBtn.addEventListener('mousedown', e => e.stopPropagation());
    camBtn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      triggerTilePhotoUpload(tile);
    });

    // crop button — crops whichever photo is currently on the tile
    const cropBtn = document.createElement('span');
    cropBtn.className = 'cms-crop-btn';
    cropBtn.setAttribute('contenteditable', 'false');
    cropBtn.title = 'Crop this tile\'s photo';
    cropBtn.textContent = '✂';
    tile.appendChild(cropBtn);
    cropBtn.addEventListener('mousedown', e => e.stopPropagation());
    cropBtn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      const img = tile.querySelector('img');
      if (!img) { toast('Add a photo to this tile first (📷), then crop it', 'err'); return; }
      openCropTool(img, dataUrl => {
        hist.push({ el: img, prevSrc: img.getAttribute('src'), prevOrigName: img.getAttribute('data-orig-name'), action: 'imgSrc' });
        img.src = dataUrl;
        img.setAttribute('data-orig-name', (img.getAttribute('data-orig-name') || img.alt || 'tile') + '-cropped.png');
        img.removeAttribute('data-replace-existing');
        document.getElementById('badge').classList.add('on');
      });
    });

    // Drop an image file straight onto the tile too
    tile.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); tile.classList.add('avatar-drag-over'); });
    tile.addEventListener('dragleave', () => tile.classList.remove('avatar-drag-over'));
    tile.addEventListener('drop', e => {
      e.preventDefault(); e.stopPropagation();
      tile.classList.remove('avatar-drag-over');
      const file = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
      if (file) setTilePhoto(tile, file);
    });

    // YouTube-link button — Gallery tiles only. Links (or unlinks) a video;
    // Save writes it into data/gallery.js so it persists across reloads.
    if (tile.closest('#mosaic')) {
      const ytBtn = document.createElement('span');
      ytBtn.className = 'cms-yt-btn';
      ytBtn.setAttribute('contenteditable', 'false');
      ytBtn.title = 'Link a YouTube video to this tile';
      ytBtn.textContent = '🎬';
      tile.appendChild(ytBtn);
      ytBtn.addEventListener('mousedown', e => e.stopPropagation());
      ytBtn.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        triggerYouTubeLink(tile);
      });
    }
  });

  // ── Publications thumbnails ── each publication row has a small .pub-thumb
  // square (rendered from data/publications.js, like every other data-driven
  // list) — hover it and click 📷 to pick an image, ✂ to crop one that's set.
  // Save also writes the resulting filename back into that entry's "thumbnail"
  // field in data/publications.js (see syncPublicationsData), so it persists
  // across reloads just like Gallery/Photos.
  pg.querySelectorAll('.pub-thumb').forEach(thumb => {
    if (thumb.hasAttribute('data-cms-tile')) return;
    thumb.setAttribute('data-cms-tile', '1');
    if (!thumb.style.position || thumb.style.position === 'static') thumb.style.position = 'relative';

    const camBtn = document.createElement('span');
    camBtn.className = 'cms-avatar-upload';
    camBtn.setAttribute('contenteditable', 'false');
    camBtn.title = 'Add / replace this publication\'s thumbnail';
    camBtn.textContent = '📷';
    thumb.appendChild(camBtn);
    camBtn.addEventListener('mousedown', e => e.stopPropagation());
    camBtn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      triggerPubThumbUpload(thumb);
    });

    const cropBtn = document.createElement('span');
    cropBtn.className = 'cms-crop-btn';
    cropBtn.setAttribute('contenteditable', 'false');
    cropBtn.title = 'Crop this thumbnail';
    cropBtn.textContent = '✂';
    thumb.appendChild(cropBtn);
    cropBtn.addEventListener('mousedown', e => e.stopPropagation());
    cropBtn.addEventListener('click', e => {
      e.preventDefault(); e.stopPropagation();
      const img = thumb.querySelector('img');
      if (!img) { toast('Add a thumbnail first (📷), then crop it', 'err'); return; }
      openCropTool(img, dataUrl => {
        hist.push({ el: img, prevSrc: img.getAttribute('src'), prevOrigName: img.getAttribute('data-orig-name'), action: 'imgSrc' });
        img.src = dataUrl;
        img.setAttribute('data-orig-name', (img.getAttribute('data-orig-name') || 'thumb') + '-cropped.png');
        img.removeAttribute('data-replace-existing');
        document.getElementById('badge').classList.add('on');
      });
    });

    thumb.addEventListener('dragover', e => { e.preventDefault(); e.stopPropagation(); thumb.classList.add('avatar-drag-over'); });
    thumb.addEventListener('dragleave', () => thumb.classList.remove('avatar-drag-over'));
    thumb.addEventListener('drop', e => {
      e.preventDefault(); e.stopPropagation();
      thumb.classList.remove('avatar-drag-over');
      const file = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
      if (file) setPubThumb(thumb, file);
    });
  });

  // Content cards (Home/People "team" grid, Alumni & Collaborator cards) are now all
  // rendered from data/*.js files (see data/team.js, data/alumni.js) rather than being
  // hand-authored in each page's HTML, so — per the rule used throughout this editor —
  // they're edited via their data file rather than deleted here. (The .cms-card
  // infrastructure below is kept in place in case a future hardcoded card section is
  // added directly to a page's HTML; just add its selector to the query below.)

  // Set up image drop zone on the whole page
  initImageDrop(pg);
}

function initImageDrop(pg) {
  // Global drop handling is already attached to #frame; nothing per-page needed.
}

/* ═══════════════════════════════════════════════
   DELETE (used by cross button and Delete key)
═══════════════════════════════════════════════ */
function deleteElement(el) {
  if (!el || !el.parentNode) return;
  hist.push({action:'delete', el, parent: el.parentNode, next: el.nextSibling, prev: el.outerHTML});
  el.remove();
  if (selEl === el) selEl = null;
  document.getElementById('badge').classList.add('on');
  toast('Deleted — click ↩ Undo to restore');
}

/* ═══════════════════════════════════════════════
   DRAG A SPECIFIC ELEMENT FROM ITS MOVE HANDLE
═══════════════════════════════════════════════ */
function beginElementDrag(el, e) {
  const startX = e.clientX, startY = e.clientY;
  if (!el.style.position || el.style.position === 'static') el.style.position = 'relative';
  const origX = parseInt(el.style.left)||0, origY = parseInt(el.style.top)||0;
  const prevLeft = el.style.left, prevTop = el.style.top;
  el.classList.add('dragging');
  document.body.style.cursor = 'grabbing';

  function mm(ev) {
    el.style.left = (origX + ev.clientX - startX) + 'px';
    el.style.top  = (origY + ev.clientY - startY) + 'px';
    document.getElementById('badge').classList.add('on');
  }
  function mu() {
    el.classList.remove('dragging');
    document.body.style.cursor = '';
    document.removeEventListener('mousemove', mm);
    document.removeEventListener('mouseup', mu);
    if (el.style.left !== prevLeft || el.style.top !== prevTop) {
      hist.push({ action:'move', el, prevLeft, prevTop });
    }
  }
  document.addEventListener('mousemove', mm);
  document.addEventListener('mouseup', mu);
}

/* ═══════════════════════════════════════════════
   RESIZE TRACKING (for images / SVG wrappers using
   the native CSS resize:both corner handle) — lets
   Ctrl+Z / ↩ Undo restore the previous size.
═══════════════════════════════════════════════ */
function trackResize(el) {
  if (el.hasAttribute('data-cms-resize-tracked')) return;
  el.setAttribute('data-cms-resize-tracked', '1');

  el.addEventListener('mousedown', e => {
    const rect = el.getBoundingClientRect();
    const nearCorner = (rect.right - e.clientX) < 22 && (rect.bottom - e.clientY) < 22;
    if (!nearCorner) return; // not grabbing the resize handle — a normal click/edit

    const startW = el.style.width || rect.width + 'px';
    const startH = el.style.height || rect.height + 'px';

    function onUp() {
      document.removeEventListener('mouseup', onUp);
      // Give the browser's native resize a tick to finish applying the new size
      requestAnimationFrame(() => {
        const newW = el.style.width, newH = el.style.height;
        if (newW && newH && (newW !== startW || newH !== startH)) {
          hist.push({ action:'resize', el, prevW: startW, prevH: startH });
          document.getElementById('badge').classList.add('on');
        }
      });
    }
    document.addEventListener('mouseup', onUp);
  });
}

/* ═══════════════════════════════════════════════
   NAV "PULL AND SNAP" REORDER DRAG
   Used for <li> items inside .nav-links — dragging the
   move handle live-reorders the item among its siblings
   instead of free pixel positioning.
═══════════════════════════════════════════════ */
function getDragAfterElement(ul, x, dragging) {
  const items = [...ul.querySelectorAll(':scope > li')].filter(li => li !== dragging);
  let closest = { offset: -Infinity, el: null };
  items.forEach(li => {
    const box = li.getBoundingClientRect();
    const offset = x - (box.left + box.width / 2);
    if (offset < 0 && offset > closest.offset) {
      closest = { offset, el: li };
    }
  });
  return closest.el;
}

function beginNavReorderDrag(li, ul, e) {
  const prevOrder = [...ul.querySelectorAll(':scope > li')];
  li.classList.add('dragging');
  li.style.opacity = '0.5';
  document.body.style.cursor = 'grabbing';

  function mm(ev) {
    const after = getDragAfterElement(ul, ev.clientX, li);
    if (after == null) ul.appendChild(li);
    else ul.insertBefore(li, after);
    document.getElementById('badge').classList.add('on');
  }
  function mu() {
    li.classList.remove('dragging');
    li.style.opacity = '';
    document.body.style.cursor = '';
    document.removeEventListener('mousemove', mm);
    document.removeEventListener('mouseup', mu);

    const newOrder = [...ul.querySelectorAll(':scope > li')];
    const changed = newOrder.some((el, i) => el !== prevOrder[i]);
    if (changed) {
      hist.push({ action:'reorder', parent: ul, prevOrder });
      toast('Reordered — snapped into new position');
    }
  }
  document.addEventListener('mousemove', mm);
  document.addEventListener('mouseup', mu);
}

/* ═══════════════════════════════════════════════
   GRID TILE "PULL AND SNAP" REORDER DRAG
   Generalised version of the nav reorder for tiles
   in a masonry/grid layout (Gallery, Photos, News).
   Reorders based on which sibling tile the cursor is
   currently hovering over, not just X position.
═══════════════════════════════════════════════ */
function getGridDragTarget(container, x, y, dragging) {
  const children = [...container.children].filter(c => c !== dragging && c.hasAttribute && (c.hasAttribute('data-cms-tile') || c.hasAttribute('data-cms-card')));
  for (const child of children) {
    const r = child.getBoundingClientRect();
    if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) {
      const before = (x < r.left + r.width / 2) || (y < r.top + r.height / 2);
      return { ref: child, before };
    }
  }
  return null;
}

function beginTileReorderDrag(tile, container, e) {
  const prevOrder = [...container.children];
  tile.classList.add('dragging');
  tile.style.opacity = '0.5';
  document.body.style.cursor = 'grabbing';

  function mm(ev) {
    const target = getGridDragTarget(container, ev.clientX, ev.clientY, tile);
    if (target) {
      if (target.before) container.insertBefore(tile, target.ref);
      else container.insertBefore(tile, target.ref.nextSibling);
    }
    document.getElementById('badge').classList.add('on');
  }
  function mu() {
    tile.classList.remove('dragging');
    tile.style.opacity = '';
    document.body.style.cursor = '';
    document.removeEventListener('mousemove', mm);
    document.removeEventListener('mouseup', mu);

    const newOrder = [...container.children];
    const changed = newOrder.some((el, i) => el !== prevOrder[i]);
    if (changed) {
      hist.push({ action:'reorder', parent: container, prevOrder });
      toast('Tile reordered');
    }
  }
  document.addEventListener('mousemove', mm);
  document.addEventListener('mouseup', mu);
}

/* ═══════════════════════════════════════════════
   DRAG TO REPOSITION
═══════════════════════════════════════════════ */
function initDrag(pg) {
  pg.querySelectorAll('.editable').forEach(el => {
    if (el.getAttribute('data-draggable')) return;
    el.setAttribute('data-draggable','1');
    el.addEventListener('mousedown', startDrag);
  });
}

let dragEl = null, dragStartX, dragStartY, dragOrigX, dragOrigY, dragPrevLeft, dragPrevTop;

function startDrag(e) {
  if (e.target.isContentEditable && document.activeElement === e.target) return; // editing, not dragging
  if (e.button !== 0) return;
  if (!e.altKey) return; // hold Alt to drag
  e.preventDefault();
  dragEl = e.currentTarget;
  const rect = dragEl.getBoundingClientRect();
  dragStartX = e.clientX; dragStartY = e.clientY;
  dragPrevLeft = dragEl.style.left; dragPrevTop = dragEl.style.top;
  if (!dragEl.style.position || dragEl.style.position === 'static') {
    dragEl.style.position = 'relative';
    dragEl.style.left = '0px'; dragEl.style.top = '0px';
  }
  dragOrigX = parseInt(dragEl.style.left)||0;
  dragOrigY = parseInt(dragEl.style.top)||0;
  dragEl.classList.add('dragging');
  document.addEventListener('mousemove', onDrag);
  document.addEventListener('mouseup', stopDrag);
}

function onDrag(e) {
  if (!dragEl) return;
  dragEl.style.left = (dragOrigX + e.clientX - dragStartX) + 'px';
  dragEl.style.top  = (dragOrigY + e.clientY - dragStartY) + 'px';
  document.getElementById('badge').classList.add('on');
}

function stopDrag() {
  if (dragEl) {
    dragEl.classList.remove('dragging');
    if (dragEl.style.left !== dragPrevLeft || dragEl.style.top !== dragPrevTop) {
      hist.push({ action:'move', el: dragEl, prevLeft: dragPrevLeft, prevTop: dragPrevTop });
    }
  }
  dragEl = null;
  document.removeEventListener('mousemove', onDrag);
  document.removeEventListener('mouseup', stopDrag);
}

/* ═══════════════════════════════════════════════
   DELETE SELECTED (toolbar button / keyboard)
═══════════════════════════════════════════════ */
function deleteSelected() {
  if (!selEl) { toast('Click an element first, then press Delete','err'); return; }
  const target = (selEl.tagName === 'IMG' && selEl.closest('.cms-hoverable')) ? selEl.closest('.cms-hoverable') : selEl;
  deleteElement(target);
}

// Delete with Backspace/Delete when nothing is focused (e.g. image selected)
document.addEventListener('keydown', e => {
  if ((e.key==='Delete'||e.key==='Backspace') && selEl && document.activeElement !== selEl) {
    e.preventDefault();
    deleteSelected();
  }
});

// Ctrl+Z / Cmd+Z — undo last action, anywhere on the page
document.addEventListener('keydown', e => {
  const isUndo = (e.ctrlKey || e.metaKey) && !e.shiftKey && e.key.toLowerCase() === 'z';
  if (isUndo) {
    e.preventDefault();
    undoLast();
  }
}, true);

/* ═══════════════════════════════════════════════
   FORMAT COMMANDS
═══════════════════════════════════════════════ */
function fmt(cmd, val) {
  document.execCommand(cmd, false, val||null);
  document.getElementById('badge').classList.add('on');
}
function setColor(hex) {
  document.execCommand('foreColor', false, hex);
  document.getElementById('badge').classList.add('on');
}

function insertLink() {
  const sel = window.getSelection();
  const hasTextSel = sel && sel.toString().trim().length > 0;
  const imgSelected = selEl && selEl.tagName === 'IMG';

  const url = prompt(hasTextSel || imgSelected
    ? 'Enter the URL to link to:'
    : 'Select some text or click an image first, then enter the URL:', 'https://');
  if (!url) return;

  if (imgSelected) {
    // Wrap image in an anchor
    const img = selEl;
    if (img.parentElement.tagName === 'A') {
      img.parentElement.href = url;
      img.parentElement.target = '_blank';
    } else {
      const a = document.createElement('a');
      a.href = url; a.target = '_blank'; a.rel = 'noopener';
      img.parentNode.insertBefore(a, img);
      a.appendChild(img);
    }
    document.getElementById('badge').classList.add('on');
    toast('Link added to image');
  } else if (hasTextSel) {
    document.execCommand('createLink', false, url);
    // Ensure it opens in new tab
    const anchors = document.querySelectorAll('a[href="'+url+'"]');
    anchors.forEach(a => { a.target='_blank'; a.rel='noopener'; });
    document.getElementById('badge').classList.add('on');
    toast('Link added to text');
  } else {
    toast('Select text or click an image first', 'err');
  }
}

/* ═══════════════════════════════════════════════
   REPLACE-IN-PLACE HELPER
   Called right before swapping an <img src> or a
   background-image url() for a NEW photo. If the
   element currently points at a real, already-saved
   file (not a data: URL), remembers that file's name
   and flags it so savePage() tells the server to
   overwrite that exact file instead of writing the
   new photo under a brand-new filename and leaving
   the old one behind as an orphan.
═══════════════════════════════════════════════ */
function markReplaceTarget(el, kind, nameAttr, newFileName) {
  let oldUrl = '';
  if (kind === 'src') {
    oldUrl = el.getAttribute('src') || '';
  } else { // 'bg' — background-image, possibly layered with a gradient
    const styleAttr = el.getAttribute('style') || '';
    const match = styleAttr.match(/url\((["']?)([^)"']+)\1\)/);
    oldUrl = match ? match[2] : '';
  }
  if (oldUrl && !oldUrl.startsWith('data:')) {
    el.setAttribute(nameAttr, oldUrl.split('/').pop());
    el.setAttribute('data-replace-existing', '1');
  } else {
    el.setAttribute(nameAttr, newFileName);
    el.removeAttribute('data-replace-existing');
  }
}

/* ═══════════════════════════════════════════════
   AVATAR SPHERE — headshot photo upload
   Replaces the initials (PI / PD / PhD / WW etc.)
   with a real photo filling the circle.
═══════════════════════════════════════════════ */
function triggerAvatarUpload(el) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.style.display = 'none';
  input.addEventListener('change', () => {
    const file = input.files[0];
    if (file) setAvatarPhoto(el, file);
    input.remove();
  });
  document.body.appendChild(input);
  input.click();
}

function setAvatarPhoto(el, file) {
  const reader = new FileReader();
  reader.onload = e => {
    const prevText = [...el.childNodes]
      .filter(n => n.nodeType === Node.TEXT_NODE)
      .map(n => n.textContent).join('');
    hist.push({ el, prevText, prevStyle: el.getAttribute('style'), action:'avatarPhoto' });

    // If this avatar already has a real (already-saved) headshot, replace that
    // exact file on disk when we save, instead of leaving it behind as an orphan.
    markReplaceTarget(el, 'bg', 'data-avatar-orig-name', file.name);

    el.style.backgroundImage = `url(${e.target.result})`;
    el.style.backgroundSize = 'cover';
    el.style.backgroundPosition = 'center';

    // Clear the initials text but keep the camera button (and its listeners) in place
    [...el.childNodes].forEach(node => {
      if (node.nodeType === Node.TEXT_NODE) node.remove();
    });

    document.getElementById('badge').classList.add('on');
    toast('Headshot set — click 💾 Save page to store it permanently');
  };
  reader.readAsDataURL(file);
}

/* ═══════════════════════════════════════════════
   NAV LOGO EMBLEM — upload your own group logo to
   replace the plain "ICE" mark, or revert back to it.
   The logo is shown whole (never cropped) inside the
   same 36×36 rounded-square slot in the nav bar.
═══════════════════════════════════════════════ */
function triggerLogoUpload(el) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.style.display = 'none';
  input.addEventListener('change', () => {
    const file = input.files[0];
    if (file) setLogoImage(el, file);
    input.remove();
  });
  document.body.appendChild(input);
  input.click();
}

function setLogoImage(el, file) {
  const reader = new FileReader();
  reader.onload = e => {
    const prevText = [...el.childNodes]
      .filter(n => n.nodeType === Node.TEXT_NODE)
      .map(n => n.textContent).join('');
    hist.push({ el, prevText, prevStyle: el.getAttribute('style'), prevHasLogo: el.getAttribute('data-has-logo'), action:'logoImage' });

    // If a real (already-saved) logo file is already set, overwrite that exact
    // file on disk when saved, instead of leaving it behind as an orphan.
    markReplaceTarget(el, 'bg', 'data-logo-orig-name', file.name);

    // 'contain' (not 'cover') so the whole logo is always visible, never cropped.
    el.style.backgroundImage = `url(${e.target.result})`;
    el.style.backgroundSize = 'contain';
    el.style.backgroundPosition = 'center';
    el.style.backgroundRepeat = 'no-repeat';
    el.setAttribute('data-has-logo', '1');

    // Clear the "ICE" text but keep the control buttons (and their listeners) in place
    [...el.childNodes].forEach(node => {
      if (node.nodeType === Node.TEXT_NODE) node.remove();
    });

    document.getElementById('badge').classList.add('on');
    toast('Logo set — click 💾 Save page to store it permanently');
  };
  reader.readAsDataURL(file);
}

function revertLogoImage(el) {
  if (el.getAttribute('data-has-logo') !== '1') return; // nothing to revert
  hist.push({ el, prevStyle: el.getAttribute('style'), prevHasLogo: el.getAttribute('data-has-logo'), action:'logoRevert' });
  el.style.removeProperty('background-image');
  el.style.removeProperty('background-size');
  el.style.removeProperty('background-position');
  el.style.removeProperty('background-repeat');
  el.removeAttribute('data-has-logo');
  el.removeAttribute('data-logo-orig-name');
  el.removeAttribute('data-replace-existing');
  const origText = el.getAttribute('data-emblem-orig-text') || 'ICE';
  el.insertBefore(document.createTextNode(origText), el.firstChild);
  document.getElementById('badge').classList.add('on');
  toast('Logo removed — click 💾 Save page to store it permanently', 'ok');
}

/* ═══════════════════════════════════════════════
   HERO BANNER — image/GIF upload, crop, remove
   Replaces the plain gradient background of the
   page's .hero / .page-hero section with a real
   photo or animated GIF. Works the same way on
   every page (Home, People, Alumni, Gallery, etc.)
   since they all share the same hero markup pattern.
═══════════════════════════════════════════════ */
function setHeroBackground(hero, srcUrl) {
  // Layer a dark gradient on top of the photo so the white hero text/heading
  // stays legible no matter how bright the uploaded image or GIF is.
  hero.style.backgroundImage = `linear-gradient(rgba(10,22,40,0.55), rgba(10,22,40,0.75)), url('${srcUrl}')`;
  hero.style.backgroundSize = 'cover, cover';
  hero.style.backgroundPosition = 'center, center';
  hero.style.backgroundRepeat = 'no-repeat, no-repeat';
}

function clearHeroBackground(hero) {
  hero.style.removeProperty('background-image');
  hero.style.removeProperty('background-size');
  hero.style.removeProperty('background-position');
  hero.style.removeProperty('background-repeat');
  hero.removeAttribute('data-hero-orig-name');
}

function triggerHeroUpload(hero) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.style.display = 'none';
  input.addEventListener('change', () => {
    const file = input.files[0];
    if (file) setHeroPhotoFromFile(hero, file);
    input.remove();
  });
  document.body.appendChild(input);
  input.click();
}

function setHeroPhotoFromFile(hero, file) {
  const reader = new FileReader();
  reader.onload = e => {
    hist.push({ el: hero, prevStyle: hero.getAttribute('style'), action: 'heroCrop' });

    // If the hero already has a real (already-saved) banner image, replace that
    // exact file on disk when we save, instead of leaving it behind as an orphan.
    markReplaceTarget(hero, 'bg', 'data-hero-orig-name', file.name);

    setHeroBackground(hero, e.target.result);
    document.getElementById('badge').classList.add('on');
    const isGif = file.type === 'image/gif';
    toast((isGif ? '🎞 Animated hero banner set' : '🖼 Hero banner set') + ' — click 💾 Save page to store it permanently');
  };
  reader.readAsDataURL(file);
}

/* ═══════════════════════════════════════════════
   GRID TILE — add / replace the tile's photo
   (Gallery, Photos, News). Inserts a real <img> so
   it's picked up by the normal per-page upload folder
   at save time (Gallery→images/Gallery/, etc.)
═══════════════════════════════════════════════ */
function triggerTilePhotoUpload(tile) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.style.display = 'none';
  input.addEventListener('change', () => {
    const file = input.files[0];
    if (file) setTilePhoto(tile, file);
    input.remove();
  });
  document.body.appendChild(input);
  input.click();
}

function setTilePhoto(tile, file) {
  const reader = new FileReader();
  reader.onload = e => {
    hist.push({ el: tile, prev: tile.innerHTML, action:'edit' });

    let img = tile.querySelector('img');
    if (!img) {
      const placeholder = tile.querySelector('.mtile-ph, .photo-placeholder, .news-card-img-placeholder');
      img = document.createElement('img');
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit;';
      if (placeholder) placeholder.replaceWith(img);
      else tile.insertBefore(img, tile.firstChild);
    }

    // If this tile already has a real (already-saved) photo, replace that exact
    // file on disk when we save — instead of leaving the old one behind as an
    // orphan and writing the new photo under a brand-new filename.
    markReplaceTarget(img, 'src', 'data-orig-name', file.name);

    img.src = e.target.result;
    img.alt = img.alt || 'tile photo';

    document.getElementById('badge').classList.add('on');
    const autoSyncs = !!tile.closest('#mosaic') || !!tile.closest('#galleryWrap'); // Gallery + Photos sync their data file on save; News doesn't (yet)
    toast(autoSyncs
      ? 'Photo set — click 💾 Save page to store it (replaces the old file)'
      : 'Photo set — click 💾 Save page, then copy the resulting filename into this entry\'s data file to make it permanent');
  };
  reader.readAsDataURL(file);
}

/* ═══════════════════════════════════════════════
   GALLERY TILE — link (or unlink) a YouTube video.
   Save writes the video ID back into that tile's
   "youtube" field in data/gallery.js (see
   syncGalleryData), so it persists across reloads,
   same as the tile's photo/caption.
═══════════════════════════════════════════════ */

// Accepts a full YouTube URL (watch/youtu.be/embed/shorts, with or without
// extra query params) or a bare 11-char video ID, and returns just the ID.
function extractYouTubeId(input) {
  if (!input) return '';
  input = String(input).trim();
  if (/^[\w-]{11}$/.test(input)) return input;
  const patterns = [
    /youtube\.com\/watch\?v=([\w-]{11})/,
    /youtu\.be\/([\w-]{11})/,
    /youtube\.com\/embed\/([\w-]{11})/,
    /youtube\.com\/shorts\/([\w-]{11})/,
  ];
  for (const re of patterns) {
    const m = input.match(re);
    if (m) return m[1];
  }
  return '';
}

function triggerYouTubeLink(tile) {
  const current = tile.getAttribute('data-youtube') || '';
  const input = prompt('Paste a YouTube link (leave blank to remove):', current ? `https://youtu.be/${current}` : '');
  if (input === null) return; // cancelled

  const existingImg = tile.querySelector('img');
  const placeholder = tile.querySelector('.mtile-ph');
  hist.push({
    el: tile, action: 'tileYoutube',
    prevYoutube: current,
    addedImg: !existingImg, // will this action create a new <img> where none existed?
    prevPlaceholderHTML: placeholder ? placeholder.outerHTML : null,
  });

  const trimmed = input.trim();
  if (!trimmed) {
    tile.removeAttribute('data-youtube');
    document.getElementById('badge').classList.add('on');
    toast('YouTube link removed — click 💾 Save page to store it', 'ok');
    return;
  }

  const id = extractYouTubeId(trimmed);
  if (!id) { toast('Couldn\'t recognize that as a YouTube link', 'err'); return; }
  tile.setAttribute('data-youtube', id);

  // If this tile doesn't already have its own uploaded photo, show YouTube's
  // thumbnail now so the editor preview matches what Save will produce —
  // an uploaded photo (if any) always stays as the thumbnail instead.
  if (!existingImg) {
    const newImg = document.createElement('img');
    newImg.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;border-radius:inherit;';
    newImg.src = `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
    newImg.alt = 'tile photo';
    if (placeholder) placeholder.replaceWith(newImg);
    else tile.insertBefore(newImg, tile.firstChild);
  }

  document.getElementById('badge').classList.add('on');
  toast('YouTube video linked — click 💾 Save page to store it');
}

/* ═══════════════════════════════════════════════
   PUBLICATION ROW — add / replace its thumbnail
   (the small square next to each entry). Save writes
   the resulting filename back into that entry's
   "thumbnail" field in data/publications.js (see
   syncPublicationsData), so it persists across reloads.
═══════════════════════════════════════════════ */
function triggerPubThumbUpload(thumb) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.style.display = 'none';
  input.addEventListener('change', () => {
    const file = input.files[0];
    if (file) setPubThumb(thumb, file);
    input.remove();
  });
  document.body.appendChild(input);
  input.click();
}

function setPubThumb(thumb, file) {
  const reader = new FileReader();
  reader.onload = e => {
    hist.push({ el: thumb, prev: thumb.innerHTML, action: 'edit' });

    let img = thumb.querySelector('img');
    if (!img) {
      const placeholder = thumb.querySelector('.pub-thumb-ph');
      img = document.createElement('img');
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;';
      if (placeholder) placeholder.replaceWith(img);
      else thumb.appendChild(img);
    }

    // Prefer this entry's deterministic suggested filename (derived at render time
    // from its year + title) so re-uploads land on the same file and stay easy to
    // reference in data/publications.js; otherwise replace whatever real file is
    // already linked, or fall back to the uploaded file's own name.
    const suggestedName = thumb.getAttribute('data-thumb-name');
    const oldSrc = img.getAttribute('src') || '';
    if (oldSrc && !oldSrc.startsWith('data:')) {
      markReplaceTarget(img, 'src', 'data-orig-name', file.name);
    } else {
      img.setAttribute('data-orig-name', suggestedName || file.name);
      img.removeAttribute('data-replace-existing');
    }

    img.src = e.target.result;
    img.alt = img.alt || 'publication thumbnail';

    document.getElementById('badge').classList.add('on');
    toast('Thumbnail set — click 💾 Save page to store it (replaces the old file)');
  };
  reader.readAsDataURL(file);
}

// Always-available toolbar entry point for the hero banner image/GIF — the
// same upload the 🖼 button on the hero itself opens, but reachable without
// having to find and hover that button first.
function triggerHeroUploadForCurrentPage() {
  const pg = document.getElementById('pg-' + cur);
  const hero = pg && pg.querySelector('.hero, .page-hero');
  if (!hero) { toast('This page has no hero banner', 'err'); return; }
  triggerHeroUpload(hero);
}

function insertImageFromFile(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  // Insert near the centre of the currently visible page area when using the toolbar button
  const cx = window.innerWidth / 2, cy = window.innerHeight / 2 + window.scrollY;
  reader.onload = e => insertImgAt(e.target.result, file.name, cx, cy);
  reader.readAsDataURL(file);
  input.value = '';
}

function insertImg(src, name) {
  // Fallback (no coordinates) — centre of current page container
  const pg = document.getElementById('pg-'+cur);
  const rect = pg.getBoundingClientRect();
  insertImgAt(src, name, rect.left + rect.width/2, rect.top + rect.height/2 + window.scrollY);
}

/* Insert an image at a specific viewport position (clientX/clientY-style coords) */
function insertImgAt(src, name, clientX, clientY) {
  const pg = document.getElementById('pg-'+cur);

  // Find the section under the drop point to anchor positioning to
  const under = document.elementFromPoint(
    Math.min(Math.max(clientX, 0), window.innerWidth-1),
    Math.min(Math.max(clientY - window.scrollY, 0), window.innerHeight-1)
  );
  let container = (under && under.closest && under.closest('section, .s-sec, .hero, .page-hero, .contact-band, #frame')) || pg;
  if (!container || !pg.contains(container)) container = pg;

  if (!container.style.position || container.style.position === 'static') {
    container.style.position = 'relative';
  }
  const cRect = container.getBoundingClientRect();
  const leftPx = Math.round(clientX - cRect.left);
  const topPx  = Math.round(clientY - cRect.top);

  const wrap = document.createElement('span');
  wrap.className = 'cms-hoverable';
  wrap.style.cssText = `position:absolute; left:${leftPx}px; top:${topPx}px; display:inline-block; z-index:5;`;

  const img = document.createElement('img');
  img.src = src;
  img.alt = name || 'inserted image';
  img.setAttribute('data-cms-img','1');
  img.setAttribute('data-orig-name', name || 'image.png'); // preserved for save-time upload
  img.style.cssText = 'width:280px;max-width:90vw;height:auto;border-radius:6px;display:block;outline:2px solid #5bb8e8;';

  const moveHandle = document.createElement('span');
  moveHandle.className = 'cms-move-handle';
  moveHandle.title = 'Drag to move';
  moveHandle.textContent = '✥';
  moveHandle.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); beginElementDrag(wrap, e); });

  const delBtn = document.createElement('span');
  delBtn.className = 'cms-del-btn';
  delBtn.title = 'Delete this image';
  delBtn.textContent = '✕';
  delBtn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); deleteElement(wrap); });

  wrap.appendChild(img);
  wrap.appendChild(moveHandle);
  wrap.appendChild(delBtn);
  attachResizeHandle(wrap, img);
  attachCropButton(wrap, img);

  img.addEventListener('click', e => {
    e.stopPropagation();
    document.querySelectorAll('.editable,.cms-hoverable').forEach(el => el.classList.remove('selected'));
    wrap.classList.add('selected');
    selEl = img;
  });

  container.appendChild(wrap);
  hist.push({action:'insert', el:wrap});
  document.getElementById('badge').classList.add('on');
  toast('Image inserted — drag the ✥ handle to reposition, ⇲ corner to resize (aspect ratio kept)');
}

/* ═══════════════════════════════════════════════
   INSERT A NEW TEXT BOX — same free-floating pattern as
   inserted images (draggable via ✥, deletable via ✕),
   dropped wherever you click/drop it on the page.
═══════════════════════════════════════════════ */
function triggerTextBoxInsert() {
  const cx = window.innerWidth / 2, cy = window.innerHeight / 2 + window.scrollY;
  insertTextBoxAt(cx, cy);
}

function insertTextBoxAt(clientX, clientY) {
  const pg = document.getElementById('pg-'+cur);

  const under = document.elementFromPoint(
    Math.min(Math.max(clientX, 0), window.innerWidth-1),
    Math.min(Math.max(clientY - window.scrollY, 0), window.innerHeight-1)
  );
  let container = (under && under.closest && under.closest('section, .s-sec, .hero, .page-hero, .contact-band, #frame')) || pg;
  if (!container || !pg.contains(container)) container = pg;

  if (!container.style.position || container.style.position === 'static') {
    container.style.position = 'relative';
  }
  const cRect = container.getBoundingClientRect();
  const leftPx = Math.round(clientX - cRect.left);
  const topPx  = Math.round(clientY - cRect.top);

  const wrap = document.createElement('span');
  wrap.className = 'cms-hoverable';
  wrap.style.cssText = `position:absolute; left:${leftPx}px; top:${topPx}px; display:inline-block; z-index:5; min-width:140px;`;

  const p = document.createElement('p');
  p.textContent = 'New text — click to edit';
  p.setAttribute('contenteditable', 'true');
  p.className = 'cms-new-textbox';
  p.style.cssText = 'margin:0; padding:4px 6px; min-width:140px; cursor:text; border-radius:4px; font-size:15px; line-height:1.5;';

  const moveHandle = document.createElement('span');
  moveHandle.className = 'cms-move-handle';
  moveHandle.setAttribute('contenteditable','false');
  moveHandle.title = 'Drag to move';
  moveHandle.textContent = '✥';
  moveHandle.addEventListener('mousedown', e => { e.preventDefault(); e.stopPropagation(); beginElementDrag(wrap, e); });

  const delBtn = document.createElement('span');
  delBtn.className = 'cms-del-btn';
  delBtn.setAttribute('contenteditable','false');
  delBtn.title = 'Delete this text box';
  delBtn.textContent = '✕';
  delBtn.addEventListener('mousedown', e => e.stopPropagation());
  delBtn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); deleteElement(wrap); });

  wrap.appendChild(p);
  wrap.appendChild(moveHandle);
  wrap.appendChild(delBtn);

  p.addEventListener('focus', () => {
    document.querySelectorAll('.editable,.cms-hoverable').forEach(el => el.classList.remove('selected'));
    wrap.classList.add('selected');
    selEl = p;
    hist.push({el:p, prev:p.innerHTML, action:'edit'});
    document.getElementById('badge').classList.add('on');
  });
  p.addEventListener('input', () => document.getElementById('badge').classList.add('on'));
  p.addEventListener('click', e => e.stopPropagation());
