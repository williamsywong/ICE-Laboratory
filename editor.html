<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ICE Group — Site Editor</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style id="page-styles"></style>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;font-size:13px;color:#2c3e50;background:#f0f7fc;overflow-x:hidden}

/* ══════════════ TOP BAR ══════════════ */
#bar{
  position:fixed;top:0;left:0;right:0;z-index:9999;
  height:50px;display:flex;align-items:center;
  background:#0a1628;border-bottom:1px solid rgba(91,184,232,0.2);
  box-shadow:0 2px 16px rgba(0,0,0,0.4);
}
#bar-logo{display:flex;align-items:center;gap:9px;padding:0 1rem;border-right:1px solid rgba(255,255,255,0.08);height:100%;flex-shrink:0}
#bar-em{width:26px;height:26px;border-radius:5px;background:linear-gradient(135deg,#5bb8e8,#2d6fa8);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff}
#bar-txt{font-size:11px;font-weight:500;color:rgba(255,255,255,0.8);line-height:1.3}
#bar-txt small{display:block;font-size:9px;color:rgba(91,184,232,0.65);font-weight:400}

#bar-pages{display:flex;align-items:center;height:100%;padding:0 4px;gap:1px;flex:1;overflow-x:auto}
.pbtn{height:100%;padding:0 .8rem;background:transparent;border:none;color:rgba(255,255,255,0.4);font-size:11.5px;font-family:'DM Sans',sans-serif;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:all .15s}
.pbtn:hover{color:rgba(255,255,255,0.8);background:rgba(255,255,255,0.04)}
.pbtn.on{color:#5bb8e8;border-bottom-color:#5bb8e8;background:rgba(91,184,232,0.08);font-weight:500}

#bar-right{display:flex;align-items:center;gap:6px;padding:0 .85rem;border-left:1px solid rgba(255,255,255,0.08);height:100%;flex-shrink:0}
#srv-dot{width:8px;height:8px;border-radius:50%;background:#555;transition:background .3s;flex-shrink:0}
#srv-dot.on{background:#1a9e6b} #srv-dot.off{background:#e05a4b}
#srv-lbl{font-size:10px;color:rgba(255,255,255,0.3);margin-right:4px}
#badge{font-size:10px;background:rgba(91,184,232,0.12);color:#5bb8e8;border:1px solid rgba(91,184,232,0.25);border-radius:20px;padding:1px 7px;display:none}
#badge.on{display:inline-block}
.bar-btn{height:28px;padding:0 .7rem;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.6);font-size:11px;font-family:'DM Sans',sans-serif;cursor:pointer;border-radius:5px;transition:all .15s;white-space:nowrap}
.bar-btn:hover{background:rgba(255,255,255,0.1);color:#fff}
#btn-save{background:#2d6fa8;border-color:#2d6fa8;color:#fff;font-weight:500}
#btn-save:hover{background:#5bb8e8;border-color:#5bb8e8}
#btn-save.saving{background:#92580a;border-color:#92580a}
#btn-save.saved{background:#1a9e6b;border-color:#1a9e6b}
#btn-save.err{background:#e05a4b;border-color:#e05a4b}

/* ══════════════ TOOLBAR ══════════════ */
#toolbar{
  position:fixed;top:50px;left:0;right:0;z-index:9998;
  height:40px;display:flex;align-items:center;gap:4px;
  background:#0d1f38;border-bottom:1px solid rgba(91,184,232,0.12);
  padding:0 .75rem;overflow-x:auto;
}
.tb-sep{width:1px;height:22px;background:rgba(255,255,255,0.1);margin:0 3px;flex-shrink:0}
.tb-btn{height:28px;padding:0 .55rem;background:transparent;border:none;color:rgba(255,255,255,0.5);font-size:12px;font-family:'DM Sans',sans-serif;cursor:pointer;border-radius:4px;transition:all .15s;display:flex;align-items:center;gap:4px;flex-shrink:0;white-space:nowrap}
.tb-btn:hover{background:rgba(255,255,255,0.08);color:#fff}
.tb-btn.active{background:rgba(91,184,232,0.15);color:#5bb8e8}
.tb-select{height:26px;padding:0 .5rem;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:rgba(255,255,255,0.7);font-size:11.5px;font-family:'DM Sans',sans-serif;border-radius:4px;cursor:pointer;flex-shrink:0}
.tb-color{width:26px;height:26px;border:none;border-radius:4px;cursor:pointer;background:transparent;padding:1px;flex-shrink:0}
.tb-hint{font-size:10px;color:rgba(255,255,255,0.2);margin-left:auto;flex-shrink:0;padding:0 .5rem}

/* ══════════════ OFFLINE BANNER ══════════════ */
#offline-banner{display:none;background:#1a0a06;border-bottom:1px solid rgba(224,90,75,0.3);padding:.5rem 1.5rem;font-size:12px;color:rgba(224,90,75,0.9);text-align:center;position:fixed;top:90px;left:0;right:0;z-index:9997}
#offline-banner.show{display:block}
#offline-banner code{font-family:monospace;font-size:11px;background:rgba(255,255,255,0.08);padding:1px 6px;border-radius:3px}

/* ══════════════ PAGE FRAME ══════════════ */
#frame{margin-top:90px;min-height:calc(100vh - 90px)}
#frame.banner-up{margin-top:122px}
.pg{display:none} .pg.on{display:block}

/* ══════════════ EDIT STATES ══════════════ */
.editable{
  outline:2px dashed transparent;outline-offset:3px;border-radius:3px;
  cursor:text;transition:outline-color .15s,background .15s;
  position:relative;
}
.editable:hover{outline-color:rgba(91,184,232,0.45);background:rgba(91,184,232,0.05)}
.editable.selected{
  outline:2px solid #5bb8e8!important;background:rgba(91,184,232,0.06)!important;
}

/* draggable wrapper */
.drag-wrap{
  position:relative;display:inline-block;
}
.drag-wrap.dragging{opacity:.6;cursor:grabbing!important}
.drag-handle{
  position:absolute;top:-10px;left:50%;transform:translateX(-50%);
  width:32px;height:10px;background:#5bb8e8;border-radius:3px 3px 0 0;
  cursor:grab;display:none;align-items:center;justify-content:center;
  font-size:8px;color:#fff;letter-spacing:1px;z-index:10;
}
.drag-handle::after{content:'⣿';font-size:10px}
.editable.selected ~ .drag-handle,
.drag-wrap:hover .drag-handle{display:flex}

/* delete button */
.del-btn{
  position:absolute;top:-10px;right:-10px;
  width:20px;height:20px;background:#e05a4b;border:none;border-radius:50%;
  color:#fff;font-size:13px;cursor:pointer;display:none;
  align-items:center;justify-content:center;z-index:11;line-height:1;
}
.drag-wrap:hover .del-btn,
.editable.selected + .del-btn{display:flex}

/* image drop zone */
.img-drop-zone{
  border:2px dashed rgba(91,184,232,0.3);border-radius:8px;
  padding:2rem;text-align:center;color:rgba(91,184,232,0.5);
  font-size:12px;cursor:pointer;transition:all .2s;
  background:rgba(91,184,232,0.04);
  min-height:100px;display:flex;align-items:center;justify-content:center;
}
.img-drop-zone.drag-over{border-color:#5bb8e8;background:rgba(91,184,232,0.1);color:#5bb8e8}
.img-drop-zone:hover{border-color:rgba(91,184,232,0.5)}

/* inserted images */
.cms-img{
  max-width:100%;display:block;border-radius:6px;
  cursor:move;
  outline:2px solid transparent;transition:outline-color .15s;
}
.cms-img:hover{outline-color:rgba(91,184,232,0.5)}
.cms-img.selected{outline-color:#5bb8e8}

/* resize handle on selected editable (text blocks only — images use the custom ⇲ grip) */
.editable.selected{resize:both;overflow:auto;min-width:40px;min-height:1em;display:inline-block}

/* move + delete corner controls */
.cms-move-handle, .cms-del-btn{
  position:absolute; width:20px; height:20px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; line-height:1; color:#fff; z-index:50;
  opacity:0; pointer-events:none; transition:opacity .15s, transform .15s;
  box-shadow:0 2px 6px rgba(0,0,0,0.35);
  user-select:none;
}
.cms-move-handle{ top:6px; left:6px; background:#2d6fa8; cursor:grab; font-size:12px; }
.cms-move-handle:active{ cursor:grabbing; }
.cms-del-btn{ top:6px; right:6px; background:#e05a4b; cursor:pointer; font-size:12px; }
.cms-del-btn:hover{ transform:scale(1.15); }
.cms-move-handle:hover{ transform:scale(1.15); }

.editable:hover .cms-move-handle,
.editable:hover .cms-del-btn,
.editable.selected .cms-move-handle,
.editable.selected .cms-del-btn,
.editable:hover .cms-avatar-upload,
.editable.selected .cms-avatar-upload,
.editable:hover .cms-crop-btn,
.editable.selected .cms-crop-btn,
.cms-hoverable:hover > .cms-move-handle,
.cms-hoverable:hover > .cms-del-btn,
.cms-hoverable:hover > .cms-crop-btn,
.cms-hoverable.selected > .cms-move-handle,
.cms-hoverable.selected > .cms-del-btn,
.cms-hoverable.selected > .cms-crop-btn,
[data-cms-tile]:hover > .cms-move-handle,
[data-cms-tile]:hover > .cms-avatar-upload,
[data-cms-tile]:hover > .cms-crop-btn,
[data-cms-tile]:hover > .cms-yt-btn,
[data-cms-tile].selected > .cms-move-handle,
[data-cms-tile].selected > .cms-avatar-upload,
[data-cms-tile].selected > .cms-crop-btn,
[data-cms-tile].selected > .cms-yt-btn,
[data-cms-card]:hover > .cms-move-handle,
[data-cms-card]:hover > .cms-del-btn,
[data-cms-card].selected > .cms-move-handle,
[data-cms-card].selected > .cms-del-btn{
  opacity:1; pointer-events:auto;
}

/* logo emblem ("ICE" square) — move/delete sit outside the icon's top corners
   (instead of overlapping its tiny 36×36 face), and two more controls —
   upload / revert-to-text — sit outside its bottom corners. */
.nav-emblem{ overflow: visible; }
.nav-emblem > .cms-move-handle{ top:-11px; left:-11px; }
.nav-emblem > .cms-del-btn{ top:-11px; right:-11px; }

/* "ICE Group · University of Sydney" header text — same idea: a single
   one-line text box, so move/delete sit outside it rather than covering
   the very text they're next to. */
.nav-name{ overflow: visible; }
.nav-name > .cms-move-handle{ top:-11px; left:-11px; }
.nav-name > .cms-del-btn{ top:-11px; right:-11px; }

/* A freshly inserted text box — dashed outline is an editor-only affordance
   so it's obvious where it is, stripped (along with this class) on save so
   it never shows on the live site. */
.cms-new-textbox{ outline: 2px dashed #5bb8e8; }
.cms-logo-upload, .cms-logo-revert{
  position:absolute; width:20px; height:20px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; line-height:1; color:#fff; z-index:50;
  opacity:0; pointer-events:none; transition:opacity .15s, transform .15s;
  box-shadow:0 2px 6px rgba(0,0,0,0.35); cursor:pointer; user-select:none;
}
.cms-logo-upload{ bottom:-11px; left:-11px; background:#2d6fa8; }
.cms-logo-upload:hover{ transform:scale(1.15); background:#5bb8e8; }
.cms-logo-revert{ bottom:-11px; right:-11px; background:#8a5cc9; }
.cms-logo-revert:hover{ transform:scale(1.15); background:#a374d9; }
.nav-emblem:hover .cms-logo-upload,
.nav-emblem.selected .cms-logo-upload{ opacity:1; pointer-events:auto; }
.nav-emblem[data-has-logo="1"]:hover .cms-logo-revert,
.nav-emblem[data-has-logo="1"].selected .cms-logo-revert{ opacity:1; pointer-events:auto; }

/* avatar sphere — photo upload button */
.cms-avatar-upload{
  position:absolute; bottom:6px; right:6px; width:24px; height:24px; border-radius:50%;
  background:#2d6fa8; display:flex; align-items:center; justify-content:center;
  font-size:12px; line-height:1; color:#fff; cursor:pointer; z-index:12;
  opacity:0; pointer-events:none; transition:opacity .15s, transform .15s;
  box-shadow:0 2px 6px rgba(0,0,0,0.4); user-select:none;
}
.cms-avatar-upload:hover{ transform:scale(1.15); background:#5bb8e8; }
[class*="avatar"].avatar-drag-over{ outline:3px dashed #5bb8e8 !important; outline-offset:2px; }

/* crop button — sits opposite the camera/upload button */
.cms-crop-btn{
  position:absolute; bottom:6px; left:6px; width:24px; height:24px; border-radius:50%;
  background:#8a5cc9; display:flex; align-items:center; justify-content:center;
  font-size:12px; line-height:1; color:#fff; cursor:pointer; z-index:12;
  opacity:0; pointer-events:none; transition:opacity .15s, transform .15s;
  box-shadow:0 2px 6px rgba(0,0,0,0.4); user-select:none;
}
.cms-crop-btn:hover{ transform:scale(1.15); background:#a374d9; }

/* YouTube-link button — Gallery tiles only, sits bottom-center (camera is
   bottom-right, crop is bottom-left, so this is the one free edge left). */
.cms-yt-btn{
  position:absolute; bottom:6px; left:50%; transform:translateX(-50%);
  width:24px; height:24px; border-radius:50%;
  background:#c9414c; display:flex; align-items:center; justify-content:center;
  font-size:12px; line-height:1; color:#fff; cursor:pointer; z-index:12;
  opacity:0; pointer-events:none; transition:opacity .15s, transform .15s;
  box-shadow:0 2px 6px rgba(0,0,0,0.4); user-select:none;
}
.cms-yt-btn:hover{ transform:translateX(-50%) scale(1.15); background:#e8525f; }

/* resize handle — bottom-right corner grip for freely-inserted/dropped images */
.cms-resize-handle{
  position:absolute; bottom:6px; right:6px; width:16px; height:16px; border-radius:4px;
  background:#5bb8e8; cursor:nwse-resize; z-index:13;
  opacity:0; pointer-events:none; transition:opacity .15s, transform .15s;
  box-shadow:0 2px 6px rgba(0,0,0,0.4);
}
.cms-resize-handle::after{
  content:''; position:absolute; right:3px; bottom:3px; width:6px; height:6px;
  border-right:2px solid rgba(10,22,40,0.55); border-bottom:2px solid rgba(10,22,40,0.55);
}
.cms-resize-handle:hover{ transform:scale(1.15); background:#7ec8e3; }
.cms-hoverable:hover > .cms-resize-handle,
.cms-hoverable.selected > .cms-resize-handle{ opacity:1; pointer-events:auto; }

/* hero banner — image/GIF upload, crop, remove controls */
.cms-hero-upload, .cms-hero-crop, .cms-hero-remove{
  position:absolute; top:14px; width:34px; height:34px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-size:15px; line-height:1; color:#fff; cursor:pointer; z-index:20;
  opacity:0; pointer-events:none; transition:opacity .15s, transform .15s;
  box-shadow:0 2px 8px rgba(0,0,0,0.45); user-select:none;
}
.cms-hero-upload{ right:14px; background:#2d6fa8; }
.cms-hero-upload:hover{ transform:scale(1.1); background:#5bb8e8; }
.cms-hero-crop{ right:56px; background:#8a5cc9; }
.cms-hero-crop:hover{ transform:scale(1.1); background:#a374d9; }
.cms-hero-remove{ right:98px; background:#c94b4b; }
.cms-hero-remove:hover{ transform:scale(1.1); background:#e05a4b; }
[data-cms-hero]:hover .cms-hero-upload,
[data-cms-hero]:hover .cms-hero-crop,
[data-cms-hero]:hover .cms-hero-remove,
[data-cms-hero].avatar-drag-over .cms-hero-upload{
  opacity:1; pointer-events:auto;
}

/* ══════════════ CROP MODAL ══════════════ */
#crop-overlay .crop-hint{ color:rgba(255,255,255,0.55); font-size:12px; }
#crop-overlay .crop-stage{ position:relative; }
#crop-overlay .crop-box{ position:absolute; border:2px dashed #5bb8e8; background:rgba(91,184,232,0.12); cursor:move; box-sizing:border-box; }
#crop-overlay .crop-handle{ position:absolute; right:-7px; bottom:-7px; width:16px; height:16px; background:#5bb8e8; border-radius:4px; cursor:nwse-resize; box-shadow:0 1px 4px rgba(0,0,0,0.5); }
#crop-overlay .crop-controls{ display:flex; gap:.6rem; }

/* ══════════════ TOAST ══════════════ */
#toast{position:fixed;bottom:1.25rem;left:50%;transform:translateX(-50%);background:#0a1628;border:1px solid rgba(91,184,232,0.3);color:#5bb8e8;font-size:11.5px;padding:.55rem 1.2rem;border-radius:8px;display:none;z-index:99999;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,0.4)}
#toast.on{display:block} #toast.ok{border-color:rgba(26,158,107,0.4);color:#1a9e6b} #toast.err{border-color:rgba(224,90,75,0.4);color:#e05a4b}

/* ══════════════ SITE STYLES ══════════════ */
:root{--ib:#2d6fa8;--ibr:#5bb8e8;--id:#0a1628;--im:#1a3a5c;--if:#f0f7fc;--bo:rgba(45,111,168,0.15)}
.s-nav{background:#0a1628;padding:0 1.5rem;display:flex;align-items:center;justify-content:space-between;height:54px;border-bottom:1px solid rgba(91,184,232,0.12)}
.s-nlogo{display:flex;align-items:center;gap:10px}
.s-nem{width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,#5bb8e8,#2d6fa8);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff}
.s-nname{font-size:12px;font-weight:500;color:#fff}.s-nname span{color:#5bb8e8}
.s-nlinks{display:flex;gap:1.25rem;list-style:none}
.s-nlinks li{font-size:10px;color:rgba(255,255,255,0.4);text-transform:uppercase;letter-spacing:.4px}
.s-hero{background:#0a1628;padding:3rem 2rem 2.5rem;position:relative;overflow:hidden}
.s-hero::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 40% at 80% 50%,rgba(91,184,232,0.08) 0%,transparent 70%)}
.s-hg{display:grid;grid-template-columns:1fr 1fr;gap:2rem;max-width:960px;margin:0 auto;position:relative;z-index:1;align-items:center}
.s-eye{font-size:10px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:#5bb8e8;display:block;margin-bottom:.75rem}
.s-h1{font-size:2rem;font-weight:400;line-height:1.1;color:#fff;margin-bottom:.6rem}
.s-h1 em{font-style:italic;color:#5bb8e8}
.s-hsub{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#6b8fa8;margin-bottom:1.25rem;padding-bottom:1.25rem;border-bottom:.5px solid rgba(91,184,232,0.15)}
.s-hdesc{color:rgba(255,255,255,0.62);font-size:13px;line-height:1.75;margin-bottom:1.5rem}
.s-hbtns{display:flex;gap:.6rem}
.s-bp{background:#2d6fa8;color:#fff;border:none;padding:.5rem 1.1rem;border-radius:5px;font-size:11px}
.s-bs{background:transparent;color:rgba(255,255,255,0.65);border:.5px solid rgba(91,184,232,0.3);padding:.5rem 1.1rem;border-radius:5px;font-size:11px}
.s-sec{padding:2rem;max-width:960px;margin:0 auto}
.s-stag{font-size:10px;font-weight:500;letter-spacing:2px;text-transform:uppercase;color:#2d6fa8;display:block;margin-bottom:.4rem}
.s-stitle{font-size:1.35rem;font-weight:500;color:#0a1628;margin-bottom:.3rem;line-height:1.2}
.s-slead{color:#567a96;font-size:13px;margin-bottom:1.5rem;line-height:1.7;max-width:480px}
.s-rg{display:grid;grid-template-columns:repeat(3,1fr);gap:.85rem}
.s-rc{background:#fff;border:.5px solid var(--bo);border-radius:10px;padding:1.2rem 1rem;position:relative;overflow:hidden}
.s-rc::before{content:'';position:absolute;top:0;left:0;right:0;height:2.5px;background:linear-gradient(90deg,#2d6fa8,#5bb8e8)}
.s-ci{font-size:20px;margin-bottom:.75rem;display:block}
.s-ct{font-size:.85rem;font-weight:500;color:#0a1628;margin-bottom:.35rem}
.s-cd{font-size:12px;color:#567a96;line-height:1.6}
.s-fwb{background:var(--if);border-top:.5px solid var(--bo);border-bottom:.5px solid var(--bo)}
.s-pg{display:grid;grid-template-columns:repeat(4,1fr);gap:.85rem}
.s-pc{background:#fff;border:.5px solid var(--bo);border-radius:10px;padding:1.2rem 1rem;text-align:center}
.s-pav{width:48px;height:48px;border-radius:50%;margin:0 auto .75rem;display:flex;align-items:center;justify-content:center;font-size:.95rem;font-weight:500;color:#fff}
.s-pn{font-weight:500;font-size:13px;color:#0a1628;margin-bottom:2px}
.s-pr{font-size:11px;color:#567a96}
.s-nl{display:flex;flex-direction:column;gap:.6rem}
.s-ni{background:#fff;border:.5px solid var(--bo);border-radius:8px;padding:.9rem 1.1rem;display:flex;gap:1rem;align-items:flex-start}
.s-nd{min-width:40px;text-align:center}
.s-nmo{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:#6b8fa8;display:block}
.s-ndy{font-size:1.1rem;font-weight:500;color:#2d6fa8;display:block}
.s-ntag{font-size:8.5px;font-weight:500;text-transform:uppercase;color:#fff;background:#2d6fa8;padding:1px 6px;border-radius:3px;display:inline-block;margin-bottom:2px}
.s-ntt{font-size:12.5px;font-weight:500;color:#0a1628;margin-bottom:1px}
.s-nb{font-size:11px;color:#567a96}
.s-cb{background:#0a1628;padding:2.5rem 2rem;position:relative;overflow:hidden}

════════════════════════════════════════════════ -->
